[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="store-search-ai"
version="0.2.0"
requires-python=">=3.11,<3.12"
dependencies=["numpy>=1.26","pandas>=2.2","pyarrow>=16","PyYAML>=6.0","openpyxl>=3.1",]

[project.optional-dependencies]
embedding=["torch>=2.2","transformers>=4.51.0","sentence-transformers>=2.7.0"]
train=["ms-swift"]
dev=["pytest>=8","ruff>=0.6","scikit-learn>=1.5","rank-bm25>=0.2.2",
"ir-measures>=0.4",]

[tool.setuptools.packages.find]
where=["src"]
