[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="store-search-ai"
version="0.2.0"
requires-python=">=3.11"
# 상한(<) 없이 하한만 걸면 팀원마다 설치 시점의 "최신"이 깔려서 서로 다른 버전이 섞인다
# (실제로 겪은 사례: pandas>=2.2만 걸어뒀더니 pandas 3.0(메이저 버전업)이 설치되면서
# 빈 문자열 컬럼의 기본 dtype이 바뀌어(PDEP-14) golden-file 비교 테스트가 깨진 적 있음 -
# 2026-09). numpy/pandas/scikit-learn/rank-bm25/ir-measures는 이 코드가 실제로 만드는
# 검색 점수(TF-IDF/BM25)·데이터프레임 dtype에 직접 영향을 주므로 다음 메이저 버전 전까지로
# 상한을 걸어둔다. 팀 전체가 정확히 같은 버전을 쓰려면 이 파일이 아니라
# requirements-lock.txt를 설치할 것(README/PIPELINE.md 참고) - 이 파일은 "이 범위면
# 동작해야 한다"는 느슨한 선언일 뿐, 재현성을 보장하는 파일이 아니다.
dependencies=["numpy>=1.26,<3","pandas>=2.2,<4","pyarrow>=16","PyYAML>=6.0","openpyxl>=3.1",]

[project.optional-dependencies]
embedding=["torch>=2.2","transformers>=4.51.0","sentence-transformers>=2.7.0"]
# 로컬에서 학습 코드를 돌릴 때의 범위. Colab에서는 런타임에 미리 깔린 버전을 그대로 쓴다(store_search_ai.common.hf_compat이
# transformers 4.51~5.x, sentence-transformers 3.3~5.x 차이를 맞춤 — docs/TRAINING.md "라이브러리 버전").
train=["sentence-transformers>=3.3,<6","transformers>=4.51,<6","peft>=0.13","datasets>=2.19","accelerate>=0.26",
"ir-measures>=0.4,<0.5",]
dev=["pytest>=8","ruff>=0.6","scikit-learn>=1.5,<2","rank-bm25>=0.2.2,<0.3",
"ir-measures>=0.4,<0.5",]

[tool.setuptools.packages.find]
where=["src"]
