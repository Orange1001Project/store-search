      operationId: createRefreshJob
      summary: 원천 파일 올리기 → 갱신 시작
      description: |
        .xlsx, 최대 100MB(FR-UPD-01). 받으면 바로 검사 → 차이 계산 → 임베딩 → 전환을 뒤에서 돌린다(202).
        진행은 GET /admin/refresh-jobs/{jobId}로 본다. 사라지는 가게가 기준(3%)을 넘으면 승인 대기(원천 정리 기간에는 적용 안 함).

        오류: 400 INVALID_FILE(.xlsx 아님) · 401 AUTH_REQUIRED · 403 CSRF_FAILED·PASSWORD_CHANGE_REQUIRED · 409 REFRESH_ALREADY_RUNNING(FR-UPD-08)·SAME_FILE_ALREADY_APPLIED(전에 반영한 파일과 같음) · 413 FILE_TOO_LARGE · 422 SOURCE_COLUMNS_MISMATCH(첫 줄 열 구성이 원천과 다름)
      x-priority: P2
      x-requirements: [FR-UPD-01, FR-UPD-02, FR-UPD-03, FR-UPD-06, FR-UPD-08]
      security: [{ adminSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/RefreshJobUploadRequest' }
            example: { file: '(원천 엑셀 파일, 예: 전통시장_가맹점_20261116.xlsx)' }
      responses:
        '202':
          description: 받음. 작업 상태
          headers:
            Location:
              description: 진행을 볼 주소(/api/v1/admin/refresh-jobs/{jobId})
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshJob' }
              example: &refreshJobUploaded
                jobId: 41
                status: validating
                steps:
                  - { step: validate, state: running, progressPct: 0 }
                  - { step: diff, state: waiting }
                  - { step: embed, state: waiting }
                  - { step: switch, state: waiting }
                fileName: 전통시장_가맹점_20261116.xlsx
                fileSize: 48213504
                startedBy: admin01
                createdAt: '2026-11-16T09:00:00+09:00'
                targetVersionName: '2026-11-16'
                needsApproval: false
                preview: null
                validationErrors: []
                errorMessage: null
