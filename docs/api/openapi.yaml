              schema: { $ref: '#/components/schemas/MessageStatsResponse' }
              example:
                total: 18240
                items:
                  - { code: expanded_partial, count: 2190, ratio: 0.12 }
                  - { code: no_result, count: 383, ratio: 0.021 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid
      description: 익명 세션(FR-LOG-05). 없으면 서버가 첫 응답에서 발급한다. 비회원 포함 모든 사용자
    memberAccess:
      type: apiKey
      in: cookie
      name: access_token
      description: 회원 접근 토큰(FR-MBR-06, P1). 토큰 유효 30분, 쿠키는 14일(만료된 토큰도 보내 TOKEN_EXPIRED를 받게). HttpOnly·Secure·SameSite=Lax
    signupToken:
      type: apiKey
      in: cookie
      name: signup_token
      description: 소셜 로그인 콜백이 준 가입 대기 토큰(10분, HttpOnly). 가입 동의에만 쓴다
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: 갱신 토큰 14일(경로 /api/v1/auth, HttpOnly·Secure). 쓸 때마다 새로 발급
    adminSession:
      type: apiKey
      in: cookie
      name: admin_sid
      description: 관리자 서버 세션, 경로 /api/v1/admin, 30분 무활동 만료(FR-ADM-02)
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        CSRF 토큰(NFR-SEC-02). 쿠키 인증을 쓰는 POST·PUT·PATCH·DELETE에 필요(로그인 요청 자체, 검색·조회·이벤트는 제외).
        관리자 API(/admin/…)는 관리자 로그인 때 받은 admin_csrf_token 쿠키 값, 회원 API는 회원 로그인 콜백·가입·토큰 갱신 때 받은 csrf_token 쿠키 값을 그대로 넣는다(둘 다 화면이 읽을 수 있는 쿠키)

  parameters:
    QueryId:
      name: queryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StoreId:
      name: storeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    OverrideField:
      name: field
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OverrideField' }
    Provider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [kakao, google] }
    StatFrom:
      name: from
      in: query
      required: true
      description: 시작 날짜(한국 시간, 포함)
      schema: { type: string, format: date }
    StatTo:
      name: to
      in: query
      required: true
      description: 끝 날짜(한국 시간, 포함). 최대 1년
      schema: { type: string, format: date }
    StatView:
      name: view
      in: query
      schema: { type: string, enum: [all, list, map], default: all }
    StatIntent:
      name: intent
      in: query
      description: 검색어 해석 의도별(FR-STA-01). all = 전체
      schema: { type: string, enum: [all, name, brand, category], default: all }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Size50:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  headers:
    TraceId:
      description: 서버 로그와 맞춰 보는 요청 ID
      schema: { type: string }
    RetryAfter:
      description: 다시 시도할 수 있을 때까지 초
      schema: { type: integer }
    SetSessionCookie:
      description: |
        익명 세션 쿠키 sid가 없거나 만료됐으면 새로 준다(FR-LOG-05).
        `sid=…; Path=/; HttpOnly; Secure; SameSite=Lax`
      schema: { type: string }

  schemas:
    # ── 공통 ──
    ErrorResponse:
      description: 모든 4xx·5xx 응답 본문(API_RULES.md 4절). 이름이 Error면 Java의 java.lang.Error와 겹쳐서 ErrorResponse로 한다
      type: object
      required: [code, message, traceId]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message:
          type: string
          description: 사람이 읽는 한국어 설명(개발·로그용). 화면 문구는 code로 고른다(요구사항 8절)
        details:
          type: object
          description: 선택. 코드에 따라 아래 키 중 일부만 온다
          additionalProperties: true
          properties:
            fields:
              type: array
              description: INVALID_REQUEST — 필드별 오류
              items: { $ref: '#/components/schemas/FieldError' }
            lockedUntil: { allOf: [{ $ref: '#/components/schemas/DateTime' }], description: ACCOUNT_LOCKED — 잠금이 풀리는 시각 }
            until: { allOf: [{ $ref: '#/components/schemas/DateTime' }], description: MAINTENANCE — 점검이 끝나는 시각(선택) }
            queryId: { type: string, format: uuid, description: SEARCH_RESULT_EXPIRED — 만료된 검색 }
            jobId: { type: integer, format: int64, description: REFRESH_ALREADY_RUNNING — 진행 중인 작업 }
            missingColumns: { type: array, items: { type: string }, description: SOURCE_COLUMNS_MISMATCH — 원천에 있어야 하는데 없는 열 }
            unexpectedColumns: { type: array, items: { type: string }, description: SOURCE_COLUMNS_MISMATCH — 원천에 없는 열 }
        traceId:
          type: string
          description: 응답 헤더 X-Trace-Id와 같은 값

    FieldError:
      type: object
      required: [field, reason]
      properties:
        field: { type: string, description: 'JSON 경로(예: q, bounds.sw.lat)' }
        reason:
          type: string
          enum: [REQUIRED, TOO_LONG, TOO_SHORT, INVALID_FORMAT, OUT_OF_RANGE, NOT_ALLOWED]

    ErrorCode:
      type: string
      description: |
        화면이 분기에 쓰는 고정 코드(API_RULES.md 4절). 새 코드는 이 목록과 API_RULES.md를 함께 고친다.
        400 INVALID_REQUEST·PASSWORD_POLICY·CURRENT_PASSWORD_WRONG·INVALID_FILE·TERMS_REQUIRED /
        401 AUTH_REQUIRED·TOKEN_EXPIRED·INVALID_CREDENTIALS·SIGNUP_EXPIRED·REFRESH_REUSED /
        403 CSRF_FAILED·ACCOUNT_LOCKED·ACCOUNT_DISABLED·PASSWORD_CHANGE_REQUIRED /
        404 STORE_NOT_FOUND·NOT_FOUND / 409 REFRESH_ALREADY_RUNNING·SAME_FILE_ALREADY_APPLIED·INVALID_STATE·FAVORITE_LIMIT·ALREADY_MEMBER /
        410 SEARCH_RESULT_EXPIRED / 413 FILE_TOO_LARGE / 422 SOURCE_COLUMNS_MISMATCH / 429 RATE_LIMITED /
        500 INTERNAL_ERROR / 503 SERVICE_UNAVAILABLE·MAINTENANCE
      enum:
        - INVALID_REQUEST
        - PASSWORD_POLICY
        - CURRENT_PASSWORD_WRONG
        - INVALID_FILE
        - TERMS_REQUIRED
        - AUTH_REQUIRED
        - TOKEN_EXPIRED
        - INVALID_CREDENTIALS
        - SIGNUP_EXPIRED
        - REFRESH_REUSED
        - CSRF_FAILED
        - ACCOUNT_LOCKED
        - ACCOUNT_DISABLED
        - PASSWORD_CHANGE_REQUIRED
        - STORE_NOT_FOUND
        - NOT_FOUND
        - REFRESH_ALREADY_RUNNING
        - SAME_FILE_ALREADY_APPLIED
        - INVALID_STATE
        - FAVORITE_LIMIT
        - ALREADY_MEMBER
        - SEARCH_RESULT_EXPIRED
        - FILE_TOO_LARGE
        - SOURCE_COLUMNS_MISMATCH
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - MAINTENANCE

    LatLng:
      type: object
      description: |
        WGS84 좌표. 형식 검사는 위도 -90~90, 경도 -180~180만 한다(넘으면 400).
        국내 범위(위도 33~39, 경도 124~132) 밖은 오류가 아니다: center·userLocation은 없는 것으로 보고 기본 위치로(FR-LOC-02, 작은 줄 ⑨),
        bounds는 국내 범위와 겹치는 부분만 쓴다(안 겹치면 0곳). 가게 좌표는 원천 값 그대로(소수 여섯째 자리까지)
      required: [lat, lng]
      properties:
        lat: { type: number, format: double, minimum: -90, maximum: 90 }
        lng: { type: number, format: double, minimum: -180, maximum: 180 }

    Bounds:
      type: object
      description: 지도 화면 범위
      required: [sw, ne]
      properties:
        sw: { $ref: '#/components/schemas/LatLng' }
        ne: { $ref: '#/components/schemas/LatLng' }

    DateTime:
      type: string
      format: date-time
      description: KST 오프셋을 붙인 ISO 8601
      example: '2026-11-13T14:30:00+09:00'

    Cursor:
      type: string
      description: 다음 페이지 요청에 그대로 보내는 값. 응답에 없으면 마지막 페이지

    CategoryCode:
      type: string
      description: 업종 칩 코드 = 공식 온누리 중분류 K001~K017(category 표, /meta에서 목록)
      pattern: '^K0(0[1-9]|1[0-7])$'
      example: K006

    PaymentCode:
      type: string
      enum: [card, qr]

    LifecycleStatus:
      type: string
      description: active 영업중, pending 확인 대기, closed 폐업
      enum: [active, pending, closed]

    MessageCode:
      type: string
      description: |
        큰 안내 문구 코드(FR-MSG-02 ①~⑥·⑧·⑩~⑫).
        ⑩ zoom_in은 화면이 지도 대각선을 재서 직접 띄우고 API를 부르지 않는다(서버는 같은 기준을 넘는 bounds를 400으로 거절).
        ⑪ empty_query: 빈 값은 화면이 막고, 기호·일반어만('가게', '곳' 등)인 검색어는 서버가 검색하지 않고 200 + 0곳 + 이 코드로 준다(FR-SRC-03)
      enum: [expanded_none_in_first, expanded_partial, no_result, area_empty, map_empty,
             no_exact_name, weak_result, map_moved, zoom_in, empty_query, chip_empty]

    SubMessageCode:
      type: string
      description: |
        검색창 아래 작은 줄 문구 코드(FR-MSG-02 ⑦·⑨). ⑦은 두 경우라 코드를 나눈다.
        name_first(P0): '{storeName}' 가게를 먼저 보여 드려요 · {region} 지역으로 보기 → skipNameFirst=true로 다시 검색.
        region_ambiguous(P1): {region}에서 찾았어요 · 다른 {name} → 시트에 interpretation.otherRegions(지금 지역 포함, 거리순)를 보여 주고, current가 아닌 지역을 고르면 regionChoice로 다시 검색.
        default_location: 위치 정보가 없어 기본 위치 기준으로 찾았어요 · 위치 켜기(⑨).
      enum: [name_first, region_ambiguous, default_location]

    Message:
      type: object
      description: 문구는 코드와 치환값만. 문장은 화면 설정값(FR-MSG-02)
      required: [code]
      properties:
        code: { $ref: '#/components/schemas/MessageCode' }
        params:
          type: object
          description: 'n, m(②), region(③-2), query(⑤)'
          properties:
            n: { type: integer }
            m: { type: integer }
            region: { type: string }
            query: { type: string }

    SubMessage:
      type: object
      required: [code]
      properties:
        code: { $ref: '#/components/schemas/SubMessageCode' }
        params:
          type: object
          description: 'name_first → storeName·region, region_ambiguous → region·name'
          properties:
            region: { type: string }
            name: { type: string }
            storeName: { type: string }

    # ── 사용자 ──
    Meta:
      type: object
      required: [categories, paymentMethods, defaultLocation, policies, limits, corpusVersion]
      properties:
        categories:
          type: array
          description: 업종 칩(정렬 순서대로)
          items:
            title: CategoryItem
            type: object
            required: [code, name]
            properties:
              code: { $ref: '#/components/schemas/CategoryCode' }
              name: { type: string, example: 음식점 }
        paymentMethods:
          type: array
          description: 결제 칩(보이는 것만)
          items:
            title: PaymentMethodItem
            type: object
            required: [code, name]
            properties:
              code: { $ref: '#/components/schemas/PaymentCode' }
              name: { type: string, example: QR결제 }
        defaultLocation:
          description: 기본 위치(소상공인시장진흥공단 본부, FR-LOC-02)
          allOf: [{ $ref: '#/components/schemas/LatLng' }]
        policies:
          type: object
          description: 메뉴 아래쪽 약관·방침 링크(FR-MBR-13)와 U-12 위치 정보 이용 동의(FR-LOC-03)에 쓴다
          required: [termsUrl, privacyPolicyUrl, locationTerms]
          properties:
            termsUrl: { type: string, description: '이용약관. 1차는 온누리상품권 홈페이지 문서(새 탭)', example: 'https://www.onnuri.gift/terms?tab=0' }
            privacyPolicyUrl: { type: string, description: '개인정보처리방침(누구나 볼 수 있게 공개). 1차는 온누리상품권 홈페이지 문서(새 탭)', example: 'https://www.onnuri.gift/terms?tab=1' }
            locationTerms:
              type: object
              nullable: true
              description: |
                위치기반서비스 이용약관. 법무 결과 동의가 필요하면 채우고, 필요 없으면 null(U-12는 안내만) ⚠.
                화면은 U-12에서 고른 뒤 지금 값(version, null이면 문자열 none)을 브라우저에 저장하고, 저장한 값이 없거나 지금 값과 다르면 U-12를 띄운다.
                그래서 null → 버전이 생기면 한 번 다시 묻고, null인 동안에는 다시 묻지 않는다
              required: [version, url]
              properties:
                version: { type: string, example: '2026-11' }
                url: { type: string }
        limits:
          type: object
          required: [queryMaxLength, pageSize, maxResults, mapMaxDiagonalKm]
          properties:
            queryMaxLength: { type: integer, example: 50, description: 검색어 최대 글자 수 }
            pageSize: { type: integer, example: 20, description: 한 페이지 가게 수 }
            maxResults: { type: integer, example: 300, description: 검색·조회 결과 최대 가게 수 }
            mapMaxDiagonalKm: { type: integer, example: 50, description: 화면 대각선이 이 값(km)을 넘으면 확대 안내 ⑩(P1) }
        corpusVersion: { type: string, example: '2026-11-09' }

    SearchRequest:
      type: object
      required: [q, inputType, view]
      properties:
        q:
          type: string
          minLength: 1
          maxLength: 50
          description: 검색어. 서버가 NFKC·공백 정리(FR-SRC-02)
        inputType:
          type: string
          description: |
            화면이 사용자가 한 일을 보낸다(로그 input_type, SEARCH_LOGGING.md 2절).
            typed 직접 입력·'현 지도 재검색', recent 최근 검색어(P1), chip 칩을 바꿔 다시 검색,
            region_view "○○ 지역으로 보기"(skipNameFirst), region_choice "다른 ○○"(P1), place_store 지명만 입력의 "'○○' 가게 보기"(P1),
            autocomplete 자동완성(P2).
            browse(검색어 없는 조회)·place(지명만 입력)는 화면이 보내지 않고 서버가 정한다.
          enum: [typed, recent, chip, region_view, region_choice, place_store, autocomplete]
        view:
          type: string
          enum: [list, map]
          description: list = 검색창 검색(목록 규칙), map = 현 지도 재검색
        center:
          description: 화면이 아는 중심. 지도 화면 중심 또는 GPS. 없으면 기본 위치
          allOf: [{ $ref: '#/components/schemas/LatLng' }]
        centerSource:
          type: string
          enum: [map_viewport, gps, default]
          description: center가 무엇인지. 검색어 지명·고른 지역이 있으면 서버가 그쪽을 쓴다
        userLocation:
          description: GPS 원 좌표(선택). 검색 처리에만 쓰고 저장하지 않으며 로그엔 100m 격자만(NFR-PRV-02)
          allOf: [{ $ref: '#/components/schemas/LatLng' }]
        bounds:
          description: 지도 화면 범위. view=map이면 필수, list면 로그용(100m 격자로 저장)
          allOf: [{ $ref: '#/components/schemas/Bounds' }]
        regionChoice:
          type: string
          description: '"다른 ○○"에서 고른 지역 ID(interpretation.otherRegions[].regionId, P1, FR-MAP-10)'
        skipNameFirst:
          type: boolean
          default: false
          description: |
            true면 상호 우선(FR-SRC-07)을 건너뛰고 검색어의 지역으로 거른다. 작은 줄 name_first의 "○○ 지역으로 보기"를 누를 때(inputType=region_view).
            칩 재검색에서는 직전 값 그대로.
        categoryCode:
          allOf:
            - $ref: '#/components/schemas/CategoryCode'
          description: 업종 칩. 없으면 전체
        paymentCodes:
          type: array
          description: 결제 칩. 빈 목록 = 전체, 여러 개면 OR(FR-MSG-04)
          uniqueItems: true
          items: { $ref: '#/components/schemas/PaymentCode' }
          default: []

    BrowseRequest:
      type: object
      description: bounds(화면 범위)나 spot(겹친 가게 목록의 한 지점) 중 하나만 보낸다
      properties:
        bounds:
          description: 화면 범위. 화면 안 가게를 가까운 순 300곳까지
          allOf: [{ $ref: '#/components/schemas/Bounds' }]
        spot:
          description: |
            겹친 가게 목록(U-05b, FR-MAP-11). 누른 핀 좌표. 좌표를 소수 다섯째 자리로 반올림해 같은 가게만, 300곳 상한 없이 모두(한 지점 최대 약 500곳).
            순서는 상호 가나다순, 그다음 storeId. pins는 빈 목록
          allOf: [{ $ref: '#/components/schemas/LatLng' }]
        center:
          description: 거리순 정렬 기준. 없으면 bounds 가운데
          allOf: [{ $ref: '#/components/schemas/LatLng' }]
        centerSource:
          type: string
          enum: [map_viewport, gps, default]
        userLocation:
          description: GPS 원 좌표(선택). 저장하지 않음
          allOf: [{ $ref: '#/components/schemas/LatLng' }]
        categoryCode:
          allOf:
            - $ref: '#/components/schemas/CategoryCode'
        paymentCodes:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/PaymentCode' }
          default: []

    StoreCardBase:
      type: object
      description: 결과 카드(FR-LST-03). 품목·전화 없음
      required: [storeId, name, categoryCode, categoryName, marketName, marketType, addressShort, location, paymentCodes]
      properties:
        storeId: { type: string, format: uuid }
        name: { type: string }
        categoryCode: { $ref: '#/components/schemas/CategoryCode' }
        categoryName: { type: string, example: 음식점 }
        marketName: { type: string, nullable: true }
        marketType: { type: string, nullable: true, description: 원천에 값이 있을 때만(골목형상점가 등) }
        addressShort: { type: string, description: 시군구 + 도로명, example: 서구 둔산로 8 }
        location: { $ref: '#/components/schemas/LatLng' }
        paymentCodes:
          type: array
          items: { $ref: '#/components/schemas/PaymentCode' }
        favorited:
          type: boolean
          description: 로그인한 회원의 관심 가맹점이면 true(P1). 비회원 응답에는 없음. 캐시하지 않고 응답할 때마다 계산(/page 포함)

    StoreCard:
      description: 검색·조회 결과 카드
      allOf:
        - $ref: '#/components/schemas/StoreCardBase'
        - type: object
          required: [rank]
          properties:
            rank: { type: integer, minimum: 1, description: 전체 목록 안 순위(1부터) }
            distanceFromCenterM:
              type: integer
              description: 검색 중심에서의 거리(m). 화면 거리 표시는 GPS로 화면이 계산(FR-LST-04)

    StorePin:
      description: |
        지도 핀. 결과 카드(StoreCard)와 같은 필드 + topStore. 핀을 누르면 추가 호출 없이 요약 카드(U-05, FR-MAP-08)를 띄우고,
        pin_click 이벤트의 position에 rank를 쓴다. 300곳이면 압축 전 약 75KB.
        좌표가 같은 핀(location 소수 다섯째 자리까지 같음)은 화면이 핀 하나로 묶어 숫자를 달고, 누르면 그 핀들로 "이 위치 가맹점 n곳" 목록을 만든다
        (FR-MAP-11, 추가 호출 없음). 순서는 /search면 rank, /browse면 상호 가나다순.
      allOf:
        - $ref: '#/components/schemas/StoreCard'
        - type: object
          properties:
            topStore: { type: boolean, description: 맨 위 가게(FR-RNK-05) }

    Interpretation:
      type: object
      description: 검색어 해석(FR-SRC-05)
      required: [region, intent, nameFirst, otherRegions]
      properties:
        region:
          type: object
          nullable: true
          description: 검색어에서 읽은 지역. 상호 우선이면 거르지 않았어도 채운다("○○ 지역으로 보기"의 ○○)
          required: [regionId, name, scope]
          properties:
            regionId: { type: string, description: '지명 사전 ID(gazetteer.entry_id를 문자열로, regionChoice와 같은 값)' }
            name: { type: string, example: 대전 중구 }
            scope: { type: string, enum: [area, point], description: 'gazetteer.scope. area = 지역 전체(행정구역), point = 그 지점 1km 원(역·시장 등)' }
        intent:
          type: string
          nullable: true
          enum: [name, brand, category, null]
        nameFirst: { type: boolean, description: 상호 우선을 적용했는지(FR-SRC-07). skipNameFirst=true로 보낸 요청이면 false }
        otherRegions:
          type: array
          maxItems: 6
          description: |
            "다른 ○○" 선택 시트(P1, FR-SRC-06·FR-MAP-10). 같은 이름 지명이 여러 곳일 때만 채우고, 지금 고른 지역(current = true)과
            다른 지역(최대 5)을 함께 distanceKm 오름차순으로 준다. 같은 이름 지명이 없으면 빈 배열
          items:
            title: OtherRegion
            type: object
            required: [regionId, name, distanceKm, current]
            properties:
              regionId: { type: string }
              name: { type: string, example: 대구 중구 }
              distanceKm:
                type: number
                format: double
                minimum: 0
                description: 사용자 위치(userLocation, 없으면 검색 중심)에서 그 지역 중심까지 km(소수 첫째 자리). 화면 표시는 10km 이상이면 정수
              current: { type: boolean, description: 지금 결과를 보여 주는 지역('지금 보는 곳') }

    SearchResponse:
      type: object
      required: [queryId, view, interpretation, center, centerSource, radiusStage, results, pins, totalCount, corpusVersion, pipelineVersion]
      properties:
        queryId: { type: string, format: uuid }
        view: { type: string, enum: [list, map] }
        interpretation: { $ref: '#/components/schemas/Interpretation' }
        center: { $ref: '#/components/schemas/LatLng' }
        centerSource:
          type: string
          enum: [query_region, ui_region, map_viewport, gps, default]
        radiusStage:
          type: string
          enum: ['1km', '10km', area, viewport]
        message:
          allOf:
            - $ref: '#/components/schemas/Message'
        subMessage:
          allOf:
            - $ref: '#/components/schemas/SubMessage'
        results:
          type: array
          maxItems: 20
          description: 첫 20곳
          items: { $ref: '#/components/schemas/StoreCard' }
        pins:
          type: array
          maxItems: 300
          description: 결과 전체 핀(≤ 300)
          items: { $ref: '#/components/schemas/StorePin' }
        totalCount:
          type: integer
          minimum: 0
          description: 조건에 맞는 전체 가게 수. 검색은 300 이하. 지명만 입력(placeOnly)의 조회는 /browse처럼 300을 넘을 수 있고 그때 pins·/page는 앞 300곳까지
        nextCursor: { $ref: '#/components/schemas/Cursor' }
        mapFit:
          description: |
            지도를 옮길 범위. view=list이고 결과가 있으면 결과에 맞춘 범위(FR-MAP-03, 칩 재검색 포함).
            view=map은 없음(옮기지 않음), 단 0곳이라 화면 중심에서 다시 찾아 옮긴 경우(⑧)는 옮길 범위. 지명만 입력이면 placeOnly.mapFit과 같다
          allOf:
            - $ref: '#/components/schemas/Bounds'
        placeOnly:
          description: |
            검색어가 지명뿐이면(P1, FR-SRC-04) 가게를 검색하지 않고 지도를 그 지역으로 옮긴다.
            이때 results·pins·totalCount·nextCursor는 placeOnly.mapFit 범위의 검색어 없는 조회 결과(/browse와 같은 규칙·순서)다.
            radiusStage = viewport, centerSource = query_region, interpretation.region = 그 지명, intent = null.
            message는 그 조회가 0곳이면 map_empty
          allOf:
            - $ref: '#/components/schemas/PlaceOnly'
        corpusVersion: { type: string, example: '2026-11-09' }
        pipelineVersion: { type: string, example: policy_v1+calib_x1 }

    BrowseResponse:
      type: object
      required: [queryId, results, pins, totalCount, corpusVersion]
      properties:
        queryId: { type: string, format: uuid }
        message:
          allOf:
            - $ref: '#/components/schemas/Message'
        subMessage:
          allOf:
            - $ref: '#/components/schemas/SubMessage'
        results:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/StoreCard' }
        pins:
          type: array
          maxItems: 300
          description: 가까운 순 앞 300곳까지. spot 요청이면 빈 목록
          items: { $ref: '#/components/schemas/StorePin' }
        totalCount:
          type: integer
          minimum: 0
          description: 조건에 맞는 전체 가게 수(300을 넘을 수 있다). bounds 요청에서 totalCount가 pins 수보다 크면 300곳에서 잘린 것. spot 요청은 그 지점 전부라 /page로 끝까지 볼 수 있다
        nextCursor: { $ref: '#/components/schemas/Cursor' }
        corpusVersion: { type: string }

    PageResponse:
      type: object
      required: [queryId, results]
      properties:
        queryId: { type: string, format: uuid }
        results:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/StoreCard' }
        nextCursor: { $ref: '#/components/schemas/Cursor' }

    StoreDetail:
      type: object
      description: 가게 상세(FR-DTL-02). 관리자 수정 값 반영
      required: [storeId, name, categoryCode, categoryName, marketName, marketType, address, location, paymentCodes]
      properties:
        storeId: { type: string, format: uuid }
        name: { type: string }
        categoryCode: { $ref: '#/components/schemas/CategoryCode' }
        categoryName: { type: string }
        marketName: { type: string, nullable: true }
        marketType: { type: string, nullable: true }
        address: { type: string }
        location: { $ref: '#/components/schemas/LatLng' }
        paymentCodes:
          type: array
          items: { $ref: '#/components/schemas/PaymentCode' }
        favorited:
          type: boolean
          description: 로그인한 회원의 관심 가맹점이면 true(P1). 비회원 응답에는 없음

    # ── 관리자 ──
    AdminLoginRequest:
      type: object
      required: [loginId, password]
      properties:
        loginId: { type: string, maxLength: 30 }
        password: { type: string, maxLength: 100, format: password }

    AdminPasswordChangeRequest:
      type: object
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 100
          format: password
          description: 평소 변경에 필수. 첫 로그인 변경(mustChangePassword = true)에는 보내지 않는다
        newPassword: { type: string, minLength: 8, maxLength: 100, format: password }

    StoreVisibilityRequest:
      type: object
      required: [hidden, reason]
      properties:
        hidden: { type: boolean }
        reason: { type: string, minLength: 1, maxLength: 200 }

    AdminStoreListResponse:
      type: object
      required: [items, page, size, totalCount]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminStoreRow' }
        page: { type: integer }
        size: { type: integer }
        totalCount: { type: integer }

    AdminMe:
      type: object
      required: [adminId, loginId, mustChangePassword]
      properties:
        adminId: { type: integer, format: int64 }
        loginId: { type: string }
        mustChangePassword: { type: boolean }
        lastLoginAt: { $ref: '#/components/schemas/DateTime' }

    OverrideField:
      type: string
      description: 화면·API로 고칠 수 있는 필드(FR-STO-03). DB store_override.field_name의 camelCase. 주소·좌표(location)는 1차에 DB 직접 작업이라 없음(P2에서 주소·좌표·법정동 코드를 받는 API를 따로 정함)
      enum: [storeName, items, marketName, paymentCard, paymentQr, category]

    StoreOverrideRequest:
      type: object
      required: [value, reason]
      properties:
        value:
          description: |
            field에 따라 JSON 값의 종류가 다르다(타입을 하나로 정할 수 없어 명세에서는 타입을 비워 둠, 서버가 field별로 검사).
            storeName·marketName → 문자열(최대 100자, DB 열 길이), items → 문자열(최대 1000자), paymentCard·paymentQr → true/false, category → CategoryCode 문자열
          example: '치킨, 통닭, 닭강정'
        reason: { type: string, minLength: 1, maxLength: 200 }

    AdminStoreRow:
      type: object
      required: [storeId, name, address, marketName, marketType, categoryCode, status, hidden, edited, editedCount, coordError]
      properties:
        storeId: { type: string, format: uuid }
        name: { type: string, description: 수정 값 반영 }
        address: { type: string }
        marketName: { type: string, nullable: true }
        categoryCode: { $ref: '#/components/schemas/CategoryCode' }
        status: { $ref: '#/components/schemas/LifecycleStatus' }
        statusChangedAt: { $ref: '#/components/schemas/DateTime' }
        marketType: { type: string, nullable: true, description: 원천에 값이 있을 때만(골목형상점가 등). A-03 "시장명 · 시장유형" 열 }
        hidden: { type: boolean }
        edited: { type: boolean }
        editedCount: { type: integer, minimum: 0, description: 수정 값이 있는 필드 수(A-03 "수정 2" 표시) }
        coordError: { type: boolean }

    FieldValue:
      type: object
      description: |
        A-04 표의 한 줄: 원천 값·수정 값·마지막 수정(FR-STO-02·09). fields는 늘 7줄을 화면 순서대로 준다
        (storeName, items, location, marketName, category, paymentCard, paymentQr).
        location(주소·좌표·법정동 코드)은 보기만 한다(editable = false, 1차 수정은 DB 직접, 화면 수정은 P2).
        고칠 수 없는 값(사업자번호·가맹점번호·시장유형·상태)은 AdminStoreDetail 위쪽 필드다
      required: [field, editable, sourceValue, overrideValue, lastEdit, sourceChanged]
      properties:
        field:
          type: string
          enum: [storeName, items, location, marketName, category, paymentCard, paymentQr]
          description: location 말고는 OverrideField와 같은 값
        editable: { type: boolean, description: '필드 수정 API(PUT·DELETE …/overrides/{field})로 고칠 수 있는지. location만 false' }
        sourceValue:
          description: '원천 값. 모양은 StoreOverrideRequest.value와 같고 location은 { lat, lng, legalDongCode, address }. 원천에 값이 없으면 null'
        overrideValue: { description: '수정 값(모양은 sourceValue와 같음). 없으면 null' }
        lastEdit:
          type: object
          nullable: true
          description: 지금 수정 값을 저장한 기록. 수정 값이 없으면 null
          required: [adminLoginId, editedAt, reason]
          properties:
            adminLoginId: { type: string }
            editedAt: { $ref: '#/components/schemas/DateTime' }
            reason: { type: string }
        sourceChanged:
          type: boolean
          description: 고친 뒤 원천 값이 바뀜(원천 변경 알림, P1)

    AdminStoreDetail:
      type: object
      required: [storeId, name, businessNo, merchantNo, marketType, status, statusChangedAt, hidden, visibility, coordError, sourceConflict, editedCount, fields]
      properties:
        storeId: { type: string, format: uuid }
        name: { type: string, description: 수정 값을 반영한 상호(화면 제목) }
        businessNo: { type: string }
        merchantNo: { type: string, nullable: true }
        marketType: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/LifecycleStatus' }
        statusChangedAt: { $ref: '#/components/schemas/DateTime' }
        hidden: { type: boolean }
        visibility:
          type: object
          nullable: true
          description: 마지막 숨김·해제(FR-STO-07). 한 번도 안 바꿨으면 null
          required: [reason, changedBy, changedAt]
          properties:
            reason: { type: string }
            changedBy: { type: string, description: 관리자 loginId }
            changedAt: { $ref: '#/components/schemas/DateTime' }
        coordError: { type: boolean }
        sourceConflict: { type: boolean, description: 원천 안 같은 가게 행끼리 값이 다름 }
        editedCount: { type: integer, minimum: 0, description: '수정 값이 있는 필드 수(제목 옆 "수정 2개 필드")' }
        fields:
          type: array
          minItems: 7
          maxItems: 7
          items: { $ref: '#/components/schemas/FieldValue' }

    RefreshJobUploadRequest:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary, description: '원천 엑셀(.xlsx, 최대 100MB)' }

    DataVersion:
      type: object
      required: [versionName, status]
      properties:
        versionName: { type: string, example: '2026-11-09' }
        status: { type: string, enum: [building, active, retired, failed] }
        embeddingModel: { type: string }
        activatedAt: { $ref: '#/components/schemas/DateTime' }
        counts:
          type: object
          properties:
            total: { type: integer }
            new: { type: integer }
            changed: { type: integer }
            pending: { type: integer }
            closed: { type: integer }
            coordError: { type: integer }

    RefreshStep:
      type: object
      required: [step, state]
      properties:
        step: { type: string, enum: [validate, diff, embed, switch], description: '검사·차이 계산·임베딩 생성·버전 전환(색인 포함)' }
        state: { type: string, enum: [waiting, running, done, failed] }
        progressPct: { type: integer, minimum: 0, maximum: 100 }

    RefreshJob:
      type: object
      required: [jobId, status, steps, fileName, createdAt, targetVersionName, needsApproval, preview, validationErrors, errorMessage]
      properties:
        jobId: { type: integer, format: int64 }
        status:
          type: string
          enum: [uploaded, validating, diffing, awaiting_approval, approved, embedding, switching, succeeded, failed, cancelled]
        steps:
          type: array
          items: { $ref: '#/components/schemas/RefreshStep' }
        fileName: { type: string }
        fileSize: { type: integer }
        startedBy: { type: string, description: 관리자 loginId }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        finishedAt: { $ref: '#/components/schemas/DateTime' }
        targetVersionName: { type: string, nullable: true }
        needsApproval: { type: boolean, description: 사라지는 가게가 기준(3%)을 넘음(P1) }
        preview:
          type: object
          nullable: true
          description: 차이 계산 뒤 건수와 목록(FR-UPD-02·04)
          properties:
            new: { type: integer }
            changed: { type: integer }
            toPending: { type: integer, description: 확인 대기 전환(사라짐) }
            restored: { type: integer }
            toClosed: { type: integer }
            conflicts: { type: integer }
            coordErrors: { type: integer }
            missingRatePct: { type: number, format: double, description: 사라지는 가게 비율 }
            coordErrorStores:
              type: array
              description: 좌표 오류 가게(최대 500). 운영자가 DB에서 좌표를 고치면 검색에 들어감
              items:
                title: CoordErrorStore
                type: object
                properties:
                  storeId: { type: string, format: uuid }
                  name: { type: string }
                  reason: { type: string, enum: [zero, out_of_range, conflict] }
        validationErrors:
          type: array
          description: 파일 검사 실패 이유(행 번호 포함, 최대 100)
          items:
            title: ValidationError
            type: object
            required: [reason]
            properties:
              row: { type: integer }
              column: { type: string }
              reason: { type: string }
        errorMessage: { type: string, nullable: true, description: 실패 단계·이유 }

    # ── 회원 (P1) ──
    TermsBundle:
      type: object
      description: 지금 약관 묶음. 위치기반서비스 약관은 법무 결과에 따라 추가 ⚠(FR-MBR-02)
      required: [termsVersion, items]
      properties:
        termsVersion: { type: string, example: '2026-11' }
        items:
          type: array
          items:
            title: TermsItem
            type: object
            required: [key, title, required, url]
            properties:
              key: { type: string, enum: [service, privacy, age14] }
              title: { type: string, example: 이용약관 동의 }
              required: { type: boolean }
              url: { type: string, nullable: true, description: '전문 보기 주소(만 14세 확인은 없음). service는 /meta의 policies.termsUrl과 같다' }

    Me:
      type: object
      required: [nickname, email, providers, createdAt, termsVersion]
      properties:
        nickname: { type: string, example: 회원1234 }
        email: { type: string, nullable: true, description: 구글에서 동의한 경우만. 카카오는 늘 null }
        providers:
          type: array
          description: 연결된 로그인 수단
          items: { type: string, enum: [kakao, google] }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        termsVersion: { type: string }

    RecentSearch:
      type: object
      required: [recentId, query, searchedAt]
      properties:
        recentId: { type: string, description: 하나 지우기에 쓰는 값 }
        query: { type: string, description: 마지막으로 입력한 원문 }
        searchedAt: { $ref: '#/components/schemas/DateTime' }

    FavoriteItem:
      description: 결과 카드와 같은 모양 + 추가한 시각. rank·distanceFromCenterM은 없음
      allOf:
        - $ref: '#/components/schemas/StoreCardBase'
        - type: object
          required: [addedAt]
          properties:
            addedAt: { $ref: '#/components/schemas/DateTime' }

    SignupRequest:
      type: object
      required: [termsVersion, agreements]
      properties:
        termsVersion: { type: string, description: /auth/terms에서 받은 버전 }
        agreements: { $ref: '#/components/schemas/TermsAgreements' }

    TermsAgreements:
      type: object
      required: [service, privacy, age14]
      properties:
        service: { type: boolean, description: 이용약관 }
        privacy: { type: boolean, description: 개인정보 수집·이용 }
        age14: { type: boolean, description: 만 14세 이상 }

    UpdateMeRequest:
      type: object
      required: [nickname]
      properties:
        nickname: { type: string, minLength: 2, maxLength: 12, pattern: '^[가-힣A-Za-z0-9]+$' }

    RecentSearchListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/RecentSearch' }

    FavoriteListResponse:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/FavoriteItem' }
        totalCount: { type: integer, maximum: 500 }
        nextCursor: { $ref: '#/components/schemas/Cursor' }

    # ── 행동 이벤트 (P1) ──
    EventBatchRequest:
      type: object
      required: [schemaVersion, events]
      properties:
        schemaVersion: { type: integer, minimum: 1, description: 이벤트 형식 버전(FR-LOG-04). 지금 1 }
        events:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/Event' }

    EventBatchResponse:
      type: object
      required: [accepted, rejected]
      properties:
        accepted: { type: integer, description: 저장한 이벤트 수 }
        rejected: { type: integer, description: 형식이 틀려 버린 이벤트 수 }

    Event:
      type: object
      description: SEARCH_LOGGING.md 4절. 서버가 serverTs·sessionId·봇 표시를 붙여 저장
      required: [eventId, clientTs, type]
      properties:
        eventId: { type: string, format: uuid, description: 화면이 만든 번호(재전송 중복 제거) }
        clientTs: { $ref: '#/components/schemas/DateTime' }
        type:
          type: string
          enum: [impression, click, action, dwell, region_choice, chip_change, research_here, cluster_click, pin_click, reformulate, abandon]
        queryId: { type: string, nullable: true, format: uuid }
        storeId: { type: string, nullable: true, format: uuid }
        position: { type: integer, nullable: true, minimum: 1, description: 목록 안 순위 }
        actionType:
          type: string
          nullable: true
          enum: [directions, favorite, share, null]
          description: type=action일 때
        payload:
          type: object
          description: 종류별 추가 값
          properties:
            impressedStoreIds: { type: array, maxItems: 50, items: { type: string, format: uuid }, description: impression }
            dwellSec: { type: integer, minimum: 0, description: dwell(P2) }
            regionId: { type: string, description: region_choice }
            previousQueryId: { type: string, format: uuid, description: 'reformulate, chip_change, research_here' }
            clusterSize: { type: integer, description: cluster_click — 묶음 안 가게 수 }
            clusterAction: { type: string, enum: [zoom, list], description: 'cluster_click — 확대했는지 겹친 가게 목록을 띄웠는지(FR-MAP-11)' }

    # ── 지명만 입력 (P1) ──
    PlaceOnly:
      type: object
      description: 검색어가 지명뿐일 때(FR-SRC-04). 가게를 검색하지 않고 지도를 옮긴다
      required: [region, mapFit, storeSuggestion]
      properties:
        region: { type: string, example: 노량진 }
        mapFit: { $ref: '#/components/schemas/Bounds' }
        storeSuggestion:
          type: object
          nullable: true
          description: "그 이름이 든 가게가 있으면 검색창 아래 작은 줄 \"'노량진수산' 가게 보기\""
          properties:
            name: { type: string, example: 노량진수산 }

    # ── 관리자 통계 (P1) ──
    StatsKpis:
      type: object
      required: [searches, noResultRate, expandedRate, reformulateRate, clickRate, avgFirstClickPos, cacheHitRate, fallbackRate, botSearches]
      properties:
        searches: { type: integer }
        noResultRate: { type: number, format: double }
        expandedRate: { type: number, format: double }
        reformulateRate: { type: number, format: double }
        clickRate: { type: number, format: double, description: 클릭이 1번 이상 있었던 검색 비율 }
        avgFirstClickPos: { type: number, format: double, nullable: true }
        cacheHitRate: { type: number, format: double, nullable: true, description: 확장어 캐시 적중률 }
        fallbackRate: { type: number, format: double }
        botSearches: { type: integer, description: 지표에서 뺀 봇 검색 수 }

    StatsUnit:
      type: string
      enum: [day, week, month]
      default: day

    TopQueriesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TopQueryItem' }

    TopQueryItem:
      type: object
      required: [query, count]
      properties:
        query: { type: string }
        count: { type: integer }

    ProblemQueriesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProblemQueryItem' }

    ProblemQueryItem:
      type: object
      required: [query, count]
      properties:
        query: { type: string }
        count: { type: integer }
        topMessage:
          allOf: [{ $ref: '#/components/schemas/MessageCode' }]
          description: 가장 많이 나온 문구(no_result·area_empty·no_exact_name·weak_result 중). 문구가 없던 검색뿐이면 필드 없음

    MessageStatsResponse:
      type: object
      required: [total, items]
      properties:
        total: { type: integer, description: '기간 안 검색 수(봇 제외, 문구 없는 검색 포함)' }
        items:
          type: array
          items: { $ref: '#/components/schemas/MessageStatItem' }

    MessageStatItem:
      type: object
      required: [code, count, ratio]
      properties:
        code: { $ref: '#/components/schemas/MessageCode' }
        count: { type: integer }
        ratio: { type: number, format: double, minimum: 0, maximum: 1 }

    StatsSummary:
      type: object
      required: [from, to, unit, kpis, series]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        unit: { $ref: '#/components/schemas/StatsUnit' }
        kpis: { $ref: '#/components/schemas/StatsKpis' }
        series:
          type: array
          items:
            title: StatsPeriod
            allOf:
              - type: object
                required: [period]
                properties:
                  period: { type: string, description: '기간 시작 날짜(한국 시간). day는 그날, week는 그 주 월요일, month는 그달 1일. 첫·끝 기간은 from·to로 잘린다. 예: 2026-11-09' }
              - $ref: '#/components/schemas/StatsKpis'

  responses:
    BadRequest:
      description: 형식 오류. 그 API에서 나오는 code는 API 설명의 "오류" 줄
      headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            invalidRequest:
              summary: INVALID_REQUEST — 필드 오류
              value:
                code: INVALID_REQUEST
                message: 요청 값이 올바르지 않습니다.
                details: { fields: [{ field: q, reason: TOO_LONG }] }
                traceId: 4bf92f3577b34da6
            passwordPolicy:
              summary: PASSWORD_POLICY — 비밀번호 규칙 위반
              value: { code: PASSWORD_POLICY, message: 비밀번호 규칙에 맞지 않습니다., traceId: 4bf92f3577b34da6 }
            currentPasswordWrong:
              summary: CURRENT_PASSWORD_WRONG — 비밀번호 변경에서 지금 비밀번호가 틀림(401이 아니라 400이라 로그인 화면으로 보내지 않는다)
              value: { code: CURRENT_PASSWORD_WRONG, message: 지금 비밀번호가 맞지 않습니다., traceId: 4bf92f3577b34da6 }
            termsRequired:
              summary: TERMS_REQUIRED — 필수 약관 미동의
              value: { code: TERMS_REQUIRED, message: 필수 약관에 동의해 주세요., traceId: 4bf92f3577b34da6 }
            invalidFile:
              summary: INVALID_FILE — .xlsx가 아님
              value: { code: INVALID_FILE, message: .xlsx 파일만 올릴 수 있습니다., traceId: 4bf92f3577b34da6 }
    Unauthorized:
      description: 로그인 필요·세션 만료·아이디나 비밀번호가 틀림
      headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            authRequired:
              summary: AUTH_REQUIRED — 로그인 안 함·세션 만료
              value: { code: AUTH_REQUIRED, message: 로그인이 필요합니다., traceId: 4bf92f3577b34da6 }
            invalidCredentials:
              summary: INVALID_CREDENTIALS — 아이디·비밀번호 틀림
              value: { code: INVALID_CREDENTIALS, message: 아이디 또는 비밀번호가 맞지 않습니다., traceId: 4bf92f3577b34da6 }
            tokenExpired:
              summary: TOKEN_EXPIRED — 회원 접근 토큰 만료(→ /auth/refresh)
              value: { code: TOKEN_EXPIRED, message: 로그인이 만료됐습니다., traceId: 4bf92f3577b34da6 }
            signupExpired:
              summary: SIGNUP_EXPIRED — 가입 대기 10분 지남
              value: { code: SIGNUP_EXPIRED, message: 가입 시간이 지났습니다. 다시 로그인해 주세요., traceId: 4bf92f3577b34da6 }
            refreshReused:
              summary: REFRESH_REUSED — 이미 쓴 갱신 토큰
              value: { code: REFRESH_REUSED, message: 다시 로그인해 주세요., traceId: 4bf92f3577b34da6 }
    Forbidden:
      description: 권한 없음·CSRF 실패·계정 잠금·비활성 계정·첫 비밀번호 변경 전(PASSWORD_CHANGE_REQUIRED)
      headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            csrfFailed:
              summary: CSRF_FAILED — X-CSRF-Token 없음·불일치
              value: { code: CSRF_FAILED, message: 보안 토큰이 맞지 않습니다., traceId: 4bf92f3577b34da6 }
            passwordChangeRequired:
              summary: PASSWORD_CHANGE_REQUIRED — 임시 비밀번호 세션
              value: { code: PASSWORD_CHANGE_REQUIRED, message: 비밀번호를 먼저 바꿔야 합니다., traceId: 4bf92f3577b34da6 }
            accountLocked:
              summary: ACCOUNT_LOCKED — 5회 실패 잠금
              value:
                code: ACCOUNT_LOCKED
                message: 로그인 5회 실패로 잠겼습니다.
                details: { lockedUntil: '2026-11-17T15:00:00+09:00' }
                traceId: 4bf92f3577b34da6
    NotFound:
      description: 없는 대상(폐업·숨김 가게 포함)
      headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            storeNotFound:
              summary: STORE_NOT_FOUND — 없는·폐업·숨김 가게
              value: { code: STORE_NOT_FOUND, message: 가맹점을 찾을 수 없습니다., traceId: 4bf92f3577b34da6 }
            notFound:
              summary: NOT_FOUND — 그 밖의 대상
              value: { code: NOT_FOUND, message: 대상을 찾을 수 없습니다., traceId: 4bf92f3577b34da6 }
    Conflict:
      description: 상태 충돌(관심 가맹점 500곳, 이미 가입, 갱신 실행 중, 같은 파일, 승인할 수 없는 상태)
      headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            favoriteLimit:
              summary: FAVORITE_LIMIT — 관심 가맹점 500곳
              value: { code: FAVORITE_LIMIT, message: 관심 가맹점은 500곳까지 저장할 수 있습니다., traceId: 4bf92f3577b34da6 }
            alreadyMember:
              summary: ALREADY_MEMBER — 그사이 가입이 끝남
              value: { code: ALREADY_MEMBER, message: 이미 가입된 계정입니다. 다시 로그인해 주세요., traceId: 4bf92f3577b34da6 }
            refreshAlreadyRunning:
              summary: REFRESH_ALREADY_RUNNING — 다른 갱신이 진행 중
              value: { code: REFRESH_ALREADY_RUNNING, message: 이미 진행 중인 갱신이 있습니다., details: { jobId: 41 }, traceId: 4bf92f3577b34da6 }
            sameFileAlreadyApplied:
              summary: SAME_FILE_ALREADY_APPLIED — 전에 반영한 파일
              value: { code: SAME_FILE_ALREADY_APPLIED, message: 이미 반영한 파일입니다., traceId: 4bf92f3577b34da6 }
            invalidState:
              summary: INVALID_STATE — 승인 대기가 아님
              value: { code: INVALID_STATE, message: 승인 대기 중인 작업이 아닙니다., traceId: 4bf92f3577b34da6 }
    Gone:
      description: 검색 결과 보관이 끝남(마지막 요청부터 10분)
      headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: SEARCH_RESULT_EXPIRED
            message: 검색 결과가 만료됐습니다. 다시 검색해 주세요.
            details: { queryId: 8c1f2a90-4b7e-4d2a-9c3e-1f5a6b7c8d90 }
            traceId: 4bf92f3577b34da6
    PayloadTooLarge:
      description: 올린 파일이 100MB를 넘음
      headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: FILE_TOO_LARGE, message: 파일은 100MB까지 올릴 수 있습니다., traceId: 4bf92f3577b34da6 }
    Unprocessable:
      description: 형식은 맞지만 처리할 수 없음(엑셀 열 구성이 다름)
      headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: SOURCE_COLUMNS_MISMATCH
            message: 원천 파일의 열 구성이 다릅니다.
            details: { missingColumns: [QR결제], unexpectedColumns: [] }
            traceId: 4bf92f3577b34da6
    TooManyRequests:
      description: 요청 제한 초과(IP당 1분 300회, 검색은 세션당 1분 60회, NFR-SEC-04)
      headers:
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: RATE_LIMITED, message: 요청이 너무 많습니다. 잠시 뒤 다시 시도해 주세요., traceId: 4bf92f3577b34da6 }
    ServerError:
      description: |
        500 INTERNAL_ERROR(서버 오류), 503 SERVICE_UNAVAILABLE(과부하·의존 서비스 장애)·MAINTENANCE(계획된 점검, details.until 선택).
        첫 화면이면 E-01(서버 오류 / 점검), 쓰던 중이면 대화상자(요구사항 8절). 503은 Retry-After를 줄 수 있다.
      headers:
        X-Trace-Id: { $ref: '#/components/headers/TraceId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            internalError:
              summary: 500 INTERNAL_ERROR
              value: { code: INTERNAL_ERROR, message: 서버 오류가 발생했습니다., traceId: 4bf92f3577b34da6 }
            maintenance:
              summary: 503 MAINTENANCE — 계획된 점검
              value:
                code: MAINTENANCE
                message: 서비스 점검 중입니다.
                details: { until: '2026-11-18T06:00:00+09:00' }
                traceId: 4bf92f3577b34da6
