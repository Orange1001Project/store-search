      summary: 지표 요약과 기간별 추이(A-10)
      description: |
        일별 요약 표(stats_daily)를 기간 단위로 묶는다. 날짜·주·월은 한국 시간 기준.
        봇·폴백·검색어 없는 조회·지명만 입력은 품질 지표에서 뺀다(FR-STA-01).

        오류: 400 INVALID_REQUEST(from > to, 기간 1년 초과) · 401 AUTH_REQUIRED · 403 PASSWORD_CHANGE_REQUIRED
      x-priority: P1
      x-requirements: [FR-STA-01]
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/StatFrom'
        - $ref: '#/components/parameters/StatTo'
        - name: unit
          in: query
          schema: { $ref: '#/components/schemas/StatsUnit' }
        - $ref: '#/components/parameters/StatView'
        - $ref: '#/components/parameters/StatIntent'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatsSummary' }
              example:
                from: '2026-11-10'
                to: '2026-11-16'
                unit: day
                kpis: { searches: 18240, noResultRate: 0.021, expandedRate: 0.184, reformulateRate: 0.093, clickRate: 0.412, avgFirstClickPos: 2.3, cacheHitRate: 0.97, fallbackRate: 0.001, botSearches: 512 }
                series:
                  - { period: '2026-11-10', searches: 2410, noResultRate: 0.02, expandedRate: 0.18, reformulateRate: 0.09, clickRate: 0.41, avgFirstClickPos: 2.2, cacheHitRate: 0.97, fallbackRate: 0.0, botSearches: 70 }
                  - { period: '2026-11-11', searches: 2655, noResultRate: 0.022, expandedRate: 0.19, reformulateRate: 0.094, clickRate: 0.415, avgFirstClickPos: 2.4, cacheHitRate: 0.96, fallbackRate: 0.002, botSearches: 81 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /admin/stats/top-queries:
