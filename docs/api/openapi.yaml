  # ───────────────────────── 회원: 로그인 (P1) ─────────────────────────
  /auth/{provider}/login:
    get:
      tags: [auth]
      operationId: startSocialLogin
      summary: 소셜 로그인 시작(제공자 화면으로 이동)
      description: |
        화면이 이 주소로 이동한다(fetch가 아니라 페이지 이동). 카카오·구글 인가 화면으로 302.
        위조 방지 state를 oauth_state 쿠키(HttpOnly, 10분)에 넣는다(FR-MBR-01). 카카오는 닉네임만, 구글은 openid·profile·email(IR-13·14).
        returnTo는 로그인 뒤 돌아갈 우리 서비스 안의 경로만 받는다. 아니면 `/`로 바꾼다.

        오류: 400 INVALID_REQUEST(provider가 kakao·google이 아님)
      x-priority: P1
      x-requirements: [FR-MBR-01, IR-13, IR-14]
      security: [{}, { sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Provider'
        - name: returnTo
          in: query
          description: |
            우리 서비스 안 경로만. `/`로 시작하고 두 번째 글자가 `/`·`\`가 아니며 역슬래시·제어 문자가 없고 200자 이하여야 한다.
            어기면 오류(400)가 아니라 `/`로 바꾼다(페이지 이동이라 오류 본문을 보여 줄 수 없음). 서버는 화면 경로 목록(`/`, `/store/…`, `/favorites`, `/me`)으로도 검사한다
          schema: { type: string, default: / }
          example: /store/3f6c2b1e-8a4d-4c5e-9b7a-2d1e0f9a8b71
      responses:
        '302':
          description: 제공자 인가 화면으로 이동
          headers:
            Location:
              description: '제공자 인가 주소(예: https://kauth.kakao.com/oauth/authorize?…&state=…)'
              schema: { type: string }
            Set-Cookie:
              description: '`oauth_state=…; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Lax; Max-Age=600` (returnTo도 이 값에 묶어 둔다)'
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /auth/{provider}/callback:
    get:
      tags: [auth]
      operationId: socialLoginCallback
      summary: 소셜 로그인 콜백
      description: |
        제공자가 돌려보내는 주소. state를 확인하고 인가 코드로 제공자 회원 번호를 받는다. 결과는 모두 302로 화면에 넘긴다(오류 본문 없음).
        - 가입된 회원이고 지금 약관 버전에 동의함 → access_token·refresh_token·csrf_token 쿠키를 주고 returnTo로.
        - 처음 온 사람 또는 약관 버전이 바뀐 회원 → signup_token(10분)·csrf_token 쿠키를 주고 가입 동의 화면(U-08, `/signup?returnTo=…`)으로.
        - 사용자가 제공자 화면에서 취소(error=access_denied) → 안내 없이 returnTo로(요구사항 8절).
        - 그 밖의 실패(state 불일치·만료, 제공자 오류) → returnTo에 `login=failed`를 붙여 이동, 화면이 "로그인하지 못했어요 · 다시 시도".
        같은 이메일이라도 다른 제공자 계정과 자동으로 합치지 않는다(FR-MBR-04).

        오류: 400 INVALID_REQUEST(provider가 kakao·google이 아님). 그 밖의 실패는 위처럼 302
      x-priority: P1
      x-requirements: [FR-MBR-01, FR-MBR-02, FR-MBR-04]
      security: [{}, { sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Provider'
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: error
          in: query
          description: 제공자가 준 오류(사용자 취소면 access_denied)
          schema: { type: string }
      responses:
        '302':
          description: 결과에 따라 화면으로 이동
          headers:
            Location:
              description: 'returnTo, `/signup?returnTo=…`, 또는 `returnTo?login=failed`'
              schema: { type: string }
            Set-Cookie:
              description: |
                회원: `access_token=…; Path=/api/v1; HttpOnly; Secure; SameSite=Lax; Max-Age=1209600`, `refresh_token=…; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Lax; Max-Age=1209600`, `csrf_token=…; Path=/; Secure; SameSite=Lax; Max-Age=1209600`
                가입 대기: `signup_token=…; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Lax; Max-Age=600`, `csrf_token=…`(위와 같은 속성)
                access_token은 토큰 자체(JWT exp)가 30분이고 쿠키는 refresh_token과 같이 14일 둔다. 그래야 만료된 토큰이 서버에 와서 401 TOKEN_EXPIRED → /auth/refresh로 이어진다.
                csrf_token도 14일이라 브라우저를 다시 열어도 /auth/refresh를 부를 수 있다
                어느 경우든 `oauth_state`는 지운다(Max-Age=0)
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /auth/terms:
    get:
      tags: [auth]
      operationId: getTerms
      summary: 지금 약관 묶음(가입 동의 화면용)
      description: 가입 동의 화면(U-08)을 열 때 부른다. 받은 termsVersion을 가입 요청에 그대로 보낸다.
      x-priority: P1
      x-requirements: [FR-MBR-02, DR-19]
      security: [{}, { sessionCookie: [] }]
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TermsBundle' }
              example:
                termsVersion: '2026-11'
                items:
                  - { key: service, title: 이용약관 동의, required: true, url: 'https://www.onnuri.gift/terms?tab=0' }
                  - { key: privacy, title: 개인정보 수집·이용 동의, required: true, url: 'https://www.onnuri.gift/terms?tab=1' }
                  - { key: age14, title: 만 14세 이상입니다, required: true, url: null }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /auth/signup:
    post:
      tags: [auth]
      operationId: signup
      summary: 가입 완료(약관 동의) 또는 바뀐 약관 다시 동의
      description: |
        콜백이 준 signup_token 쿠키가 있어야 한다. 필수 동의(이용약관·개인정보·만 14세)가 모두 true여야 한다.
        처음 온 사람이면 회원을 만들고(닉네임 없으면 `회원` + 숫자 4자리), 기존 회원이면 약관 버전·동의 시각만 바꾼다.
        성공하면 회원 쿠키와 새 csrf_token을 주고 signup_token을 지운다. 화면은 returnTo로 이동한다.

        오류: 400 INVALID_REQUEST·TERMS_REQUIRED(필수 동의가 false, termsVersion이 지금 버전이 아님) · 401 SIGNUP_EXPIRED(signup_token 없음·10분 지남 → 다시 로그인) · 403 CSRF_FAILED · 409 ALREADY_MEMBER(같은 제공자 계정이 그사이 다른 창에서 가입을 마침 → 다시 로그인)
      x-priority: P1
      x-requirements: [FR-MBR-02, FR-MBR-03, DR-19]
      security: [{ signupToken: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
            example:
              termsVersion: '2026-11'
              agreements: { service: true, privacy: true, age14: true }
      responses:
        '200':
          description: 기존 회원이 바뀐 약관에 다시 동의함(회원은 그대로). 헤더·본문은 201과 같다
          headers:
            Set-Cookie:
              description: '`access_token`, `refresh_token`, `csrf_token` 발급(콜백과 같은 속성), `signup_token=; Path=/api/v1/auth; Max-Age=0`(삭제)'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              example: { nickname: 둔산동주민, email: user@example.com, providers: [google], createdAt: '2026-06-02T10:00:00+09:00', termsVersion: '2026-11' }
        '201':
          description: 새 회원 가입 완료
          headers:
            Set-Cookie:
              description: '`access_token`, `refresh_token`, `csrf_token` 발급(콜백과 같은 속성), `signup_token=; Path=/api/v1/auth; Max-Age=0`(삭제)'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              example: { nickname: 회원1234, email: null, providers: [kakao], createdAt: '2026-11-17T10:00:00+09:00', termsVersion: '2026-11' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: 접근 토큰 다시 받기
      description: |
        회원 API가 401 TOKEN_EXPIRED를 주면 한 번 부르고, 성공하면 원래 요청을 다시 보낸다.
        refresh_token 쿠키(14일)로 새 access_token과 새 refresh_token을 준다. 쓴 refresh_token은 바로 폐기(FR-MBR-06).
        이미 쓴 refresh_token이 다시 오면 탈취로 보고 그 계열 토큰을 모두 폐기한다.
        401이면 회원 쿠키(access_token·refresh_token·csrf_token)를 지운다(Max-Age=0, 만들 때와 같은 Path) — 만료된 토큰을 계속 보내지 않게.
        회원이 동의한 약관 버전이 지금 버전과 다르면 갱신하지 않고 그 계열 토큰을 폐기한다(비회원으로). 다음 로그인 때 콜백이 가입 동의(U-08)로 보내 다시 동의받는다(FR-MBR-02).

        오류: 401 AUTH_REQUIRED(refresh_token 없음·만료·약관 버전이 바뀜 → 비회원으로)·REFRESH_REUSED(이미 쓴 토큰 → 비회원으로) · 403 CSRF_FAILED
      x-priority: P1
      x-requirements: [FR-MBR-06, NFR-SEC-02]
      security: [{ refreshCookie: [], csrfToken: [] }]
      responses:
        '204':
          description: 새 쿠키 발급
          headers:
            Set-Cookie:
              description: '`access_token`, `refresh_token`, `csrf_token` 새로 발급(콜백과 같은 속성)'
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 로그아웃
      description: |
        refresh_token을 폐기하고 회원 쿠키를 지운다(FR-MBR-06). 접근 토큰은 없거나 만료돼도 된다. 갱신 토큰이 이미 없어도 204(로그아웃은 실패하지 않는다).

        오류: 403 CSRF_FAILED
      x-priority: P1
      x-requirements: [FR-MBR-06, FR-MBR-09]
      security: [{ refreshCookie: [], csrfToken: [] }]
      responses:
        '204':
          description: 로그아웃됨
          headers:
            Set-Cookie:
              description: '`access_token=; Path=/api/v1; Max-Age=0`, `refresh_token=; Path=/api/v1/auth; Max-Age=0`, `csrf_token=; Path=/; Max-Age=0` (만들 때와 같은 Path여야 지워진다)'
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

