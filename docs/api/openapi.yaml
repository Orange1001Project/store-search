        오류: 400 INVALID_REQUEST · 401 AUTH_REQUIRED·TOKEN_EXPIRED · 403 CSRF_FAILED · 404 STORE_NOT_FOUND(폐업·숨김·없는 가게) · 409 FAVORITE_LIMIT(500곳 → "관심 가맹점은 500곳까지 저장할 수 있어요")
