  /search/{queryId}/page:
    get:
      tags: [search]
      operationId: getSearchPage
      summary: 다음 20곳
      description: |
        검색·조회 결과(≤ 300, /browse의 spot은 그 지점 전부)는 서버 캐시에 보관한다(FR-LST-02). 보관은 마지막 요청부터 10분이고 이 API를 부를 때마다 10분 연장한다. 그 목록에서 다음 20곳을 준다.
        화면은 받은 20곳을 목록 끝에 이어 붙이고 앞의 카드는 지우지 않는다(API_RULES.md 11절).
        favorited(P1)는 이 응답을 만들 때 다시 붙인다. 페이지를 볼 때마다 같은 queryId로 검색 로그 한 줄(FR-LOG-02).

        캐시에 없는 queryId는 10분이 지났는지 처음부터 없었는지 가리지 않고 모두 410이다.

        오류: 400 INVALID_REQUEST(cursor 형식) · 410 SEARCH_RESULT_EXPIRED(10분 동안 안 부름·모르는 queryId → 화면은 보여 준 목록을 그대로 두고 더 부르지 않는다)
      x-priority: P0
      x-requirements: [IR-02, FR-LST-01, FR-LST-02, FR-LOG-02]
      security: [{}, { sessionCookie: [] }, { sessionCookie: [], memberAccess: [] }]
      parameters:
        - $ref: '#/components/parameters/QueryId'
        - name: cursor
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Cursor' }
          example: MjA
      responses:
        '200':
          description: 성공. 마지막 페이지면 nextCursor 없음
          headers:
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageResponse' }
              example:
                queryId: 2d4f6a8c-0e1b-4c3d-8e5f-7a9b1c3d5e60
                results:
