openapi: 3.0.3
info:
  title: 가맹점 검색 서비스 API
  version: draft
  contact:
    name: store-search 팀
    url: https://github.com/Orange1001Project/store-search
  description: |
    디지털온누리상품권 가맹점 찾기 서비스 API.

    - 공통 규칙(응답·오류 형식, 인증, 요청 제한): [API_RULES.md](https://github.com/Orange1001Project/store-search/blob/main/docs/api/API_RULES.md). 화면 동작별 호출은 그 문서 11절
    - 기능 근거: docs/REQUIREMENTS.md. 각 API의 `x-priority`는 출시 우선순위(P0 출시 핵심, P1 1차 목표, P2 출시 뒤), `x-requirements`는 근거 요구사항 ID

    **인증은 모두 쿠키**다(Authorization 헤더 없음). 브라우저가 쿠키를 붙이고, 쓰기 요청(POST·PUT·PATCH·DELETE)은 CSRF 쿠키 값(회원 csrf_token, 관리자 admin_csrf_token)을 `X-CSRF-Token` 헤더에 넣는다.
    그래서 이 문서의 Authorize 버튼으로는 로그인할 수 없다. 로그인이 필요한 API는 API 서버와 같은 주소에서 띄운 문서로, 로그인 API를 먼저 부른 뒤 시험한다.

    모든 API는 429 RATE_LIMITED(Retry-After)와 500·503(INTERNAL_ERROR, SERVICE_UNAVAILABLE, MAINTENANCE)을 줄 수 있다. 모든 응답 헤더에 X-Trace-Id.
    화면은 모든 요청에 X-App-Version(화면 빌드 버전) 헤더를 붙인다(선택, 로그 app_version — NFR-OPS-07).
servers:
  - url: /api/v1
    description: 같은 주소(Nginx 뒤 또는 API 서버가 띄운 문서)
  - url: http://localhost:8080/api/v1
    description: 로컬 API 서버(Spring Boot 기본 포트)

tags:
  - name: meta
    description: 화면 시작에 필요한 고정 정보
  - name: search
    description: 검색·조회·다음 페이지 (IR-01~03)
  - name: stores
    description: 가게 상세 (IR-04)
  - name: auth
    description: 소셜 로그인·토큰 (P1, IR-06)
  - name: me
    description: 내 정보·최근 검색어·관심 가맹점·탈퇴 (P1, IR-06)
  - name: events
    description: 행동 이벤트 (P1, IR-05)
  - name: admin-auth
    description: 관리자 로그인 (FR-ADM-01·02)
  - name: admin-stores
    description: 관리자 가맹점 조회·수정·숨김 (FR-STO)
  - name: admin-stats
    description: 관리자 통계 (P1, FR-STA)
  - name: admin-refresh
    description: 주간 갱신 화면용 API (P2). 1차는 서버에서 갱신 스크립트로 실행하고 같은 상태를 refresh_job 표에 남긴다(FR-UPD-01·09)

paths:
  # ───────────────────────── 사용자 ─────────────────────────
  /meta:
    get:
      tags: [meta]
      operationId: getMeta
      summary: 칩 목록·기본 위치·제한 값
      description: |
        화면이 처음 열릴 때 한 번 부른다(첫 조회 /browse 전). 업종 칩 17개, 결제 칩, 기본 위치, 약관·방침 링크, 제한 값.
        관리자 화면도 업종 목록(A-03 필터, A-04 업종 선택지)을 여기서 받는다.
      x-priority: P0
      x-requirements: [FR-MSG-01, FR-MSG-04, FR-LOC-02, FR-SRC-01, FR-LOC-03, FR-MBR-13]
      security: [{}, { sessionCookie: [] }]
      responses:
        '200':
          description: 성공
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Meta' }
              example:
                categories:
                  - { code: K001, name: 식품·마트 }
                  - { code: K002, name: 의류 }
                  - { code: K003, name: 생활·잡화 }
                  - { code: K004, name: 인테리어 }
                  - { code: K005, name: 가전·디지털 }
                  - { code: K006, name: 음식점 }
                  - { code: K007, name: 카페·디저트 }
                  - { code: K008, name: 편의점 }
                  - { code: K009, name: 주유소 }
                  - { code: K010, name: 기타 }
                  - { code: K011, name: 미용 }
                  - { code: K012, name: 의료 }
                  - { code: K013, name: 교육·문화 }
                  - { code: K014, name: 스포츠 }
                  - { code: K015, name: 숙박·여행 }
                  - { code: K016, name: 자동차·교통 }
                  - { code: K017, name: 생활서비스 }
                paymentMethods:
                  - { code: card, name: 카드결제 }
                  - { code: qr, name: QR결제 }
                defaultLocation: { lat: 36.383625, lng: 127.318375 }
                policies:
                  termsUrl: https://www.onnuri.gift/terms?tab=0
                  privacyPolicyUrl: https://www.onnuri.gift/terms?tab=1
                  locationTerms: null
                limits: { queryMaxLength: 50, pageSize: 20, maxResults: 300, mapMaxDiagonalKm: 50 }
                corpusVersion: '2026-11-09'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /search:
    post:
      tags: [search]
      operationId: search
      summary: 검색 (목록 규칙 또는 현 지도 재검색)
      description: |
        검색창 검색(view=list)과 검색어 있는 '현 지도 재검색'(view=map). 화면 동작마다 보내는 값은 API_RULES.md 11절.
        - view=list: 반경 1km → 10km(FR-LOC-05·06). 첫 20곳(results)과 핀 전부(pins, 카드 필드 포함)를 함께 주고, mapFit으로 지도를 맞춘다.
        - view=map: bounds 필수, 그 사각형만(확장 없음). 0곳이면 화면 중심에서 목록 규칙으로 다시 찾아 mapFit과 문구 map_moved(FR-MAP-04).
        - 검색 중심은 서버가 정한다: 검색어 지명 → regionChoice → center(centerSource) → 기본 위치(FR-LOC-01).
        - 결과 0곳은 오류가 아니다. 200 + 빈 목록 + message.
        - 요청마다 새 queryId. 칩 재검색은 직전 요청 본문에서 categoryCode·paymentCodes만 바꾸고 inputType=chip.
        - skipNameFirst=true면 상호 우선(FR-SRC-07)을 건너뛰고 검색어의 지역으로 거른다("○○ 지역으로 보기").
        - 지명만 입력(P1): placeOnly를 채우고 그 범위의 검색어 없는 조회 결과를 results·pins에 함께 준다.
        - 로그인한 회원(P1)이면 favorited를 응답 때마다 붙이고, inputType이 typed·recent·place_store·autocomplete일 때만 최근 검색어에 저장한다(FR-MBR-07).

        - 검색어가 기호·일반어뿐이면 검색하지 않고 200 + 0곳 + message empty_query(FR-SRC-03).

        오류: 400 INVALID_REQUEST(빈 검색어, 50자 초과, view=map인데 bounds 없음, 좌표 형식 오류, bounds 대각선이 limits.mapMaxDiagonalKm 초과)
      x-priority: P0
      x-requirements: [IR-01, FR-SRC-03, FR-SRC-04, FR-SRC-05, FR-SRC-06, FR-SRC-07, FR-MAP-10, FR-LOC-01, FR-LOC-05, FR-LOC-06, FR-LOC-07, FR-RNK-01, FR-RNK-09, FR-MSG-01, FR-MSG-02, FR-MSG-04, FR-MAP-02, FR-MAP-03, FR-MAP-04, FR-MAP-08, FR-LST-02]
      security: [{}, { sessionCookie: [] }, { sessionCookie: [], memberAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
            examples:
              listSearch:
                summary: 검색창 검색(GPS 있음)
                value:
                  q: 둔산 치킨
                  inputType: typed
                  view: list
                  center: { lat: 36.3518, lng: 127.3786 }
                  centerSource: gps
                  userLocation: { lat: 36.3518, lng: 127.3786 }
                  paymentCodes: []
              mapSearch:
                summary: 현 지도 재검색
                value:
                  q: 치킨
                  inputType: typed
                  view: map
                  center: { lat: 36.3518, lng: 127.3786 }
                  centerSource: map_viewport
                  bounds: { sw: { lat: 36.3402, lng: 127.3651 }, ne: { lat: 36.3634, lng: 127.3921 } }
                  paymentCodes: [qr]
              chipChange:
                summary: 칩 재검색(위 검색창 검색에서 업종만 바꿈)
                value:
                  q: 둔산 치킨
                  inputType: chip
                  view: list
                  center: { lat: 36.3518, lng: 127.3786 }
                  centerSource: gps
                  userLocation: { lat: 36.3518, lng: 127.3786 }
                  categoryCode: K006
                  paymentCodes: []
              regionView:
                summary: "○○ 지역으로 보기(상호 우선 끄기)"
                value:
                  q: 둔산 가마치통닭
                  inputType: region_view
                  view: list
                  center: { lat: 36.3518, lng: 127.3786 }
                  centerSource: gps
                  skipNameFirst: true
                  paymentCodes: []
      responses:
        '200':
          description: 성공(결과 0곳 포함). 예시의 results·pins는 길이를 줄였다
          headers:
            X-Trace-Id: { $ref: '#/components/headers/TraceId' }
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
              examples:
                listResult:
                  summary: 검색창 검색 — 둔산동 안 14곳 중 앞 3곳만 표시. 1위·3위는 같은 좌표(핀 겹침)
                  value:
                    queryId: 8c1f2a90-4b7e-4d2a-9c3e-1f5a6b7c8d90
                    view: list
                    interpretation:
                      region: { regionId: '10231', name: 둔산동, scope: area }
