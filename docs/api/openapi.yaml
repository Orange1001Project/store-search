        관리자 수정 값을 반영한 현재 활성 데이터 버전의 값(FR-DTL-02). 확인 대기 가게는 평소처럼 보여 준다.
        거리는 화면이 GPS로 계산한다(FR-LST-04). 공유 글(FR-DTL-05)은 화면이 name·address로 만든다(전화는 원천에 없음).

        오류: 400 INVALID_REQUEST(storeId가 UUID 아님) · 404 STORE_NOT_FOUND(폐업·숨김·없는 ID → U-11, FR-DTL-07)
      x-priority: P0
