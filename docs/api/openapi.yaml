  /admin/stats/messages:
    get:
      tags: [admin-stats]
      operationId: getMessageStats
      summary: 안내 문구별 비율
      description: |
        검색 로그의 message 코드별 횟수와 비율(봇 제외). 문구가 없던 검색도 total에 들어간다.

        오류: 400 INVALID_REQUEST · 401 AUTH_REQUIRED · 403 PASSWORD_CHANGE_REQUIRED
      x-priority: P1
      x-requirements: [FR-STA-01]
