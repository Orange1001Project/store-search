    post:
      tags: [search]
      operationId: browse
      summary: 검색어 없는 조회 (화면 안 가맹점)
      description: |
        첫 화면, 칩만 고름, 검색어 없이 '현 지도 재검색'(FR-BRW-01~04). 화면 안 검색 대상 가게를 검색 중심 가까운 순으로 최대 300곳.
        관련 확률·점수 없음. 핀은 전부(결과 카드와 같은 필드), 시트 목록은 첫 20곳(다음은 /search/{queryId}/page). 지도는 옮기지 않는다.
        - 같은 거리면 상호 가나다순, 그다음 storeId(좌표가 같은 가게가 많다, FR-MAP-11).
        - 겹친 가게 목록(U-05b, FR-MAP-11): 조회가 300곳에서 잘렸으면(totalCount > pins 수) 화면이 bounds 대신 spot(누른 핀 좌표)으로 다시 부른다.
          spot이면 좌표를 소수 다섯째 자리로 반올림해 같은 가게만, 300곳 상한 없이 모두 상호 가나다순으로 준다. results는 첫 20곳, 나머지는 /page, pins는 빈 목록(화면에 이미 있음).

        오류: 400 INVALID_REQUEST(bounds·spot 둘 다 없음·둘 다 있음, 좌표 형식 오류, bounds 대각선이 limits.mapMaxDiagonalKm 초과 — 화면은 먼저 재서 부르지 않는다)
