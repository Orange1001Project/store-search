        결과 없음 또는 문구 ⑤(정확히 일치하는 가게 없음)·⑥(약한 결과)이 많은 순(FR-STA-02, DB 설계 조회 ⑪). 지명 제외·별칭을 DB에 넣을 때 참고한다.

        오류: 400 INVALID_REQUEST · 401 AUTH_REQUIRED · 403 PASSWORD_CHANGE_REQUIRED
      x-priority: P1
