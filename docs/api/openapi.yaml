  # ───────────────────────── 관리자: 로그인 ─────────────────────────
  /admin/auth/login:
    post:
      tags: [admin-auth]
      operationId: adminLogin
      summary: 관리자 로그인
      description: |
        성공하면 admin_sid 세션 쿠키와 admin_csrf_token 쿠키를 준다(회원의 csrf_token과 따로). 30분 무활동이면 만료(FR-ADM-02).
        mustChangePassword가 true면 화면은 비밀번호 변경으로 보낸다. 바꾸기 전까지는 GET /admin/me, PUT /admin/me/password,
        POST /admin/auth/logout만 되고 다른 관리자 API는 403 PASSWORD_CHANGE_REQUIRED(FR-ADM-04).

        오류: 400 INVALID_REQUEST · 401 INVALID_CREDENTIALS(5번 연속이면 잠금) · 403 ACCOUNT_LOCKED(30분, details.lockedUntil)·ACCOUNT_DISABLED
      x-priority: P0
      x-requirements: [FR-ADM-01, FR-ADM-02, FR-ADM-04]
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminLoginRequest' }
            example: { loginId: admin01, password: '********' }
      responses:
        '200':
          description: 성공
          headers:
            Set-Cookie:
              description: |
                `admin_sid=…; Path=/api/v1/admin; HttpOnly; Secure; SameSite=Lax` (서버 세션, 30분 무활동 만료)
                `admin_csrf_token=…; Path=/; Secure; SameSite=Lax` (관리자 화면이 읽어 X-CSRF-Token 헤더에 넣음, HttpOnly 아님. 회원 csrf_token과 이름이 달라 같은 브라우저에서 서로 덮어쓰지 않는다)
                한 응답에 Set-Cookie 헤더가 두 줄 온다
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMe' }
              examples:
                normal:
                  summary: 평소 로그인
                  value: { adminId: 1, loginId: admin01, mustChangePassword: false, lastLoginAt: '2026-11-16T09:12:00+09:00' }
                firstLogin:
                  summary: 임시 비밀번호로 첫 로그인
                  value: { adminId: 2, loginId: admin02, mustChangePassword: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /admin/auth/logout:
    post:
      tags: [admin-auth]
      operationId: adminLogout
      summary: 관리자 로그아웃
      description: |
        세션을 폐기하고 쿠키를 지운다. 세션이 이미 끝났어도 204(로그아웃은 실패하지 않는다).

        오류: 403 CSRF_FAILED
      x-priority: P0
      x-requirements: [FR-ADM-02]
      security: [{ adminSession: [], csrfToken: [] }]
      responses:
        '204':
          description: 로그아웃
          headers:
            Set-Cookie:
              description: '`admin_sid=; Path=/api/v1/admin; Max-Age=0`, `admin_csrf_token=; Path=/; Max-Age=0` (두 쿠키를 지움. 회원 쿠키는 건드리지 않음)'
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /admin/me:
    get:
      tags: [admin-auth]
      operationId: getAdminMe
      summary: 로그인한 관리자
      description: |
        관리자 화면이 열릴 때 세션이 살아 있는지 확인한다. 첫 비밀번호 변경 전 세션도 200(mustChangePassword = true).

        오류: 401 AUTH_REQUIRED → A-01 로그인
      x-priority: P0
      x-requirements: [FR-ADM-02]
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMe' }
              example: { adminId: 1, loginId: admin01, mustChangePassword: false, lastLoginAt: '2026-11-17T09:05:00+09:00' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /admin/me/password:
    put:
      tags: [admin-auth]
      operationId: changeAdminPassword
      summary: 비밀번호 변경(첫 로그인 포함)
      description: |
        규칙: 영문·숫자·특수문자 3종 8자 이상 또는 2종 10자 이상, 지금 비밀번호와 달라야 한다(FR-ADM-01).
        - 첫 로그인(mustChangePassword = true): newPassword만. 임시 비밀번호로 막 로그인한 것이 확인을 대신한다. 성공하면 mustChangePassword = false.
        - 평소 변경: currentPassword 필수. 틀린 횟수는 로그인 5회 잠금에 포함.

        오류: 400 INVALID_REQUEST(평소 변경인데 currentPassword 없음)·PASSWORD_POLICY·CURRENT_PASSWORD_WRONG(currentPassword 틀림, 5회 잠금에 셈) · 401 AUTH_REQUIRED · 403 CSRF_FAILED·ACCOUNT_LOCKED(틀린 횟수가 5회가 되면 잠그고 세션도 끝냄)
      x-priority: P0
      x-requirements: [FR-ADM-01, FR-ADM-04]
      security: [{ adminSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPasswordChangeRequest' }
            examples:
              firstLogin:
                summary: 첫 로그인 변경
                value: { newPassword: '********' }
              normal:
                summary: 평소 변경
                value: { currentPassword: '********', newPassword: '********' }
      responses:
        '204': { description: 변경됨(세션 유지) }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────── 관리자: 가맹점 ─────────────────────────
  /admin/stores:
    get:
      tags: [admin-stores]
      operationId: listAdminStores
      summary: 가맹점 목록(A-03)
      description: |
        검색·거르기·50건씩 페이지(FR-STO-01). 순서는 고정: 상호(수정 값 반영) 가나다순, 같으면 storeId. 정렬 파라미터 없음.
        폐업·숨김 가게도 나온다(status·hidden으로 거름).

        오류: 400 INVALID_REQUEST · 401 AUTH_REQUIRED · 403 PASSWORD_CHANGE_REQUIRED
      x-priority: P0
      x-requirements: [FR-STO-01]
      security: [{ adminSession: [] }]
      parameters:
        - name: q
          in: query
          description: 상호·사업자번호·주소·시장명·storeId 중 하나와 일치·포함
          schema: { type: string, maxLength: 100 }
          example: 가마치
        - name: status
