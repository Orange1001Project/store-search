        '5XX': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────── 행동 이벤트 (P1) ─────────────────────────
  /events:
    post:
      tags: [events]
      operationId: postEvents
      summary: 행동 이벤트 묶음 보내기
      description: |
        화면이 몇 초마다 모아 보내고, 떠날 때는 navigator.sendBeacon으로 보낸다(FR-LOG-03). 한 번에 최대 50개.
        sendBeacon 때문에 CSRF 토큰과 회원 쿠키를 요구하지 않는다(익명 세션만). 회원 ID는 로그에 넣지 않는다(FR-LOG-05).
        형식이 틀린 이벤트는 그 이벤트만 버리고 나머지는 받는다(rejected 수). 같은 eventId가 다시 오면 통계 때 한 번만 센다.

        오류: 400 INVALID_REQUEST(본문 전체가 형식 오류, events가 0개·50개 초과, schemaVersion을 모름)
      x-priority: P1
      x-requirements: [IR-05, FR-LOG-03, FR-LOG-04, FR-LST-05]
      security: [{}, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventBatchRequest' }
            example:
              schemaVersion: 1
              events:
                - eventId: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                  clientTs: '2026-11-17T12:30:02+09:00'
                  type: impression
                  queryId: 8c1f2a90-4b7e-4d2a-9c3e-1f5a6b7c8d90
                  payload: { impressedStoreIds: [3f6c2b1e-8a4d-4c5e-9b7a-2d1e0f9a8b71, 5a1d7c3b-2e9f-4a8b-8c6d-0e1f2a3b4c52] }
                - eventId: 1c2d3e4f-5a6b-4c7d-9e8f-0a1b2c3d4e5f
                  clientTs: '2026-11-17T12:30:09+09:00'
                  type: click
                  queryId: 8c1f2a90-4b7e-4d2a-9c3e-1f5a6b7c8d90
                  storeId: 3f6c2b1e-8a4d-4c5e-9b7a-2d1e0f9a8b71
                  position: 1
                - eventId: 2d3e4f5a-6b7c-4d8e-8f9a-1b2c3d4e5f60
                  clientTs: '2026-11-17T12:30:15+09:00'
                  type: cluster_click
                  queryId: 8c1f2a90-4b7e-4d2a-9c3e-1f5a6b7c8d90
                  payload: { clusterSize: 12, clusterAction: list }
      responses:
        '202':
          description: 받음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventBatchResponse' }
              example: { accepted: 3, rejected: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  # ───────────────────────── 관리자: 통계 (P1) ─────────────────────────
  /admin/stats/summary:
    get:
      tags: [admin-stats]
