<!doctype html>
<!--
  openapi.yaml을 Swagger UI로 보는 페이지.
  저장소 맨 위 폴더에서:  python -m http.server 8081 --directory docs/api
  브라우저에서:          http://localhost:8081/swagger.html
  yaml을 고치고 새로 고침하면 바로 반영된다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>가맹점 찾기 API</title>
<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css">
</head>
<body>
<div id="ui"></div>
<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
<script>
  SwaggerUIBundle({
    url: 'openapi.yaml?t=' + Date.now(),
    dom_id: '#ui',
    deepLinking: true,
    docExpansion: 'list',
    defaultModelsExpandDepth: 0,
    displayOperationId: true,
    filter: true,
    tryItOutEnabled: false
  });
</script>
</body>
</html>
