# 임시 업종 체계 v0(2026-11-04, docs/archive/SERVICE_PIPELINE_PLAN.md 11-14). 대분류 = 회의에서 받은 공식 업종 17개 이름. 공식 업종 데이터(가게별 코드)가
# 오면 이 파일 대신 그 데이터를 쓴다 — 쓰는 쪽(src/store_search_ai/data/category.py)은 가게 → 대분류 표만 본다.
#
# 가게 업종 = 취급품목(정규화: 공백·기호 제거, 소문자)에 든 키워드로 정한다. 여러 업종에 걸리면 모두 기록하고, 대표 업종은 취급품목에서 가장 앞에
# 나온 키워드의 업종(같은 위치면 아래 순서가 앞인 것). 취급품목이 비었거나 어느 키워드에도 안 걸리면 상호 끝말(name_suffixes)로, 그래도 없으면 기타.
# 키워드는 코퍼스 취급품목 상위 토큰 700개와 1차 적용 뒤 기타로 남은 상위 150개 취급품목을 보고 정했다. 자동 교정(오타)은 하지 않는다(11-3).
