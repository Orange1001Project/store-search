# 일괄 판정 후보 등록부 — docs/EVALUATION_POLICY.md 3절.
#
# 탐색 중에는 판정하지 않는다(판정 누락에 강한 지표로 고른다). "괜찮다"고 본 구성이 나올 때마다 여기에 적어 두고,
# 최종 비교 직전에 scripts/collect_judging_candidates.py로 등록된 후보 전부의 상위 결과를 **한 번에** 판정한다.
#
# - name: 판정 pool에 남는 시스템 이름(영문 소문자·숫자·_+.-, 기존 pool 시스템 이름과 겹치면 안 됨)
# - val / test: run 파일(query_id, doc_id, rank, score, system). active 쿼리 전부를 상위 depth개 이상 담고 있어야 한다.
#   test run은 채점하지 않고 만든다 — 노트북 15번(runs/pooling_runs/<이름>.csv, val+test 한 파일이면 val·test에 같은 경로)
#   하이브리드·reranker 구성은 임베딩 v1 라운드에 넣지 않는다(검색 파이프라인 단계에서 따로 — docs/EMBEDDING_V1_PLAN.md).
#   그때는 scripts/eval_retrieval_stack.py --split test로 test run을 만든다.
# - note: 어떤 구성인지 한 줄(라운드 manifest에 남는다)

round: final_v1      # 판정 라운드 이름 → benchmark/storesearch_ko_v1/annotations/<round>/
depth: 10            # 후보마다 상위 몇 개를 판정 대상으로 넣을지(TREC 관례 10~20, 비용은 --dry-run 표로 확인)
splits: [val, test]

candidates: []
# 예(2026-10-15 기준 유망 후보 — test run을 만든 뒤 주석을 풀어 등록):
#  - name: kse14_dense
#    note: Qwen3-Embedding-0.6B LoRA kse14(215 train queries)
#    val: results/model_eval/qwen3_embedding_0_6b_ft_kse14_20261014_0440/run_t1_minimal_val.csv
#    test: <노트북 15번 runs/pooling_runs/qwen3_embedding_0_6b_ft_kse14_20261014_0440.csv>
#  - name: bge_m3_ft_<owner>
#    note: bge-m3 full FT — 담당자가 고른 최고 run(학습 데이터 sha, 핵심 설정)
#    val: <노트북 15번 runs/pooling_runs/<TAG>.csv>
#    test: <같은 파일>
#  - name: arctic_ko_ft_<owner>
#    note: Snowflake Arctic-KO full FT — 담당자가 고른 최고 run
#    val: <노트북 15번 runs/pooling_runs/<TAG>.csv>
#    test: <같은 파일>
