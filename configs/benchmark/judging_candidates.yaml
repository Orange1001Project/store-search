# 일괄 판정 후보 등록부 — docs/EVALUATION_POLICY.md 3절.
#
# 탐색 중에는 판정하지 않는다(판정 누락에 강한 지표로 고른다). "괜찮다"고 본 구성이 나올 때마다 여기에 적어 두고,
# 최종 비교 직전에 scripts/collect_judging_candidates.py로 등록된 후보 전부의 상위 결과를 **한 번에** 판정한다.
#
# - name: 판정 pool에 남는 시스템 이름(영문 소문자·숫자·_+.-, 기존 pool 시스템 이름과 겹치면 안 됨)
# - val / test: run 파일(query_id, doc_id, rank, score, system). active 쿼리 전부를 상위 depth개 이상 담고 있어야 한다.
#   test run은 채점하지 않고 만든다 — 노트북 15번(runs/pooling_runs/<이름>.csv, val+test 한 파일이면 val·test에 같은 경로)
#   하이브리드·reranker 구성은 임베딩 v1 라운드에 넣지 않는다(검색 파이프라인 단계에서 따로 — docs/EMBEDDING_V1_PLAN.md).
#   그때는 scripts/eval_retrieval_stack.py --split test로 test run을 만든다.
# - note: 어떤 구성인지 한 줄(라운드 manifest에 남는다)

round: final_v1_val  # 판정 라운드 이름 → benchmark/storesearch_ko_v1/annotations/<round>/
depth: 10            # 후보마다 상위 몇 개를 판정 대상으로 넣을지(TREC 관례 10~20, 비용은 --dry-run 표로 확인)
# 2026-10-16: val 판정 완료(A·B 220쌍 + 조정 22행 → qrels_val +217). 세 후보 모두 test run이 아직 없어 val만 먼저 판정했다(선택은 val로 하므로 이것으로 공정 비교가 된다).
# 고른 1개의 test run(노트북 15번)이 오면 그 모델만 test 상위 10개를 별도 라운드(final_v1_test)로 판정한 뒤 test를 1회 채점한다.
splits: [val]

candidates:
  - name: kse16_dense
    note: Qwen3-Embedding-0.6B LoRA kse16(hard negative 6, train data ec3a9b61 215 queries, T4 fp16)
    val: results/model_eval/qwen3_embedding_0_6b_ft_kse16_20261016_0012/run_t1_minimal_val.csv
  - name: bge_m3_ft_mj
    note: bge-m3 full FT bge_m3_ft_mj_20261014_0743 — 노트북 기본값, train data ec3a9b61, T4 fp16. 임베딩 v1 선택(2026-10-16)
    val: results/model_eval/bge_m3_ft_mj_20261014_0743/run_t1_minimal_val.csv
  - name: arctic_ko_ft_lee
    note: Snowflake Arctic-KO full FT lee_20261015_1434(lr 5e-6, epoch 1, positive 4, train data 067e4aa4 237 queries, L4 bf16)
    val: results/model_eval/snowflake_arctic_embed_l_v2_ko_ft_lee_20261015_1434/run_t1_minimal_val.csv
