# 비활성(status=inactive) 쿼리 목록 — scripts/05_init_benchmark.py가 queries.csv를 만들 때 읽는다.
#
# 비활성 쿼리는 queries.csv에 행은 남지만 qrels·평가·학습 데이터 어디에도 들어가지 않는다
# (load_active_queries, 11_build_qrels.py가 status == active만 쓴다). 판정 기록(annotations/)도 그대로 남으므로
# 다시 쓰려면 이 목록에서 빼고 05 → 11 → 12를 다시 돌리면 된다(재판정 불필요).
#
# 2026-10-14 팀 결정: T6 기계변형 중 실제 오타 변형 49개(train 22 / val 12 / test 15)를 비활성화.
# - 이유: 오타는 임베딩 모델보다 검색 앞단의 철자 교정이 다룰 문제이고(서비스 관례), 철자 교정은 기본 검색 성능을 확정한 뒤
#   검색 로그와 함께 다룬다. 오타 강건성 연구도 오타 쿼리를 주 지표에 섞지 않고 별도 세트로 보고한다.
# - 근거(val): 오타 증강 학습(kse13_20261013_0721)이 기준선 대비 nDCG@10 Δ +0.001(p=0.70), 오타 쿼리 bad@3 0.375 그대로.
#   실패 유형이 실제 단어·상호와의 충돌(과잉, 원담, 운돈→돈)과 분절 오류(원단추천→단추)라 학습으로 고쳐지지 않음.
#   val 오타 쿼리가 12개뿐이라 쿼리 하나가 그 묶음 평균을 0.08씩 움직임. T6는 규칙으로 만든 변형이라 실제 사용자 오타 분포도 아님.
# - "~추천" 변형(46개)과 띄어쓰기 변형(건강 식품·주방 용품·피부 관리)은 오타가 아닌 자연스러운 쿼리라 남긴다.
