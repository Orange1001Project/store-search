# 코퍼스 기반 합성 학습 쿼리 설정 — 계획은 docs/SERVICE_QUERYSET.md 4절.
# 사람이 쓴 서비스셋 쿼리는 평가 전용이고, 학습 쿼리는 여기 설정으로 코퍼스에서 만든다.
version: synthetic_queries_v1
random_seed: 20261019
output_dir: data/finetune/synthetic

# 서비스셋 test와 겹치지 않게 뺄 것. 서비스셋 템플릿의 B_가맹점표본 가맹점이 정답에 들어가는 쿼리는 만들지 않는다.
# 작성이 끝나면 test 쿼리에 쓰인 브랜드를 exclude_brands에 추가하고 다시 만든다(3단계 거르기에서 문자열 중복도 한 번 더 뺀다).
exclude:
  service_template: data/query/service_queryset_v1.xlsx
  exclude_brands: []

# B 상호명 — 규칙 생성(GPU 불필요). scripts/gen_name_queries.py
names:
  n_stores: 10000
  # 정답이 이보다 많은 쿼리(예: 'GS25' 571곳)는 학습 신호가 같은 쿼리 하나로 몰리므로 남기되 표시만 한다
  many_positives: 50
  # 업종어와 같은 상호(예: '카페', '정육점')는 상호명 쿼리가 아니라 업종 쿼리라서 뺀다.
  # 취급품목 토큰 중 이 횟수 이상 나오는 말 + 기존 업종명·positive_terms를 업종어로 본다.
  category_min_count: 5

# A·C — Colab LLM 생성 입력. scripts/export_generation_inputs.py → colab/generate_queries.ipynb
llm:
  n_stores: 10000
  queries_per_store: 3
  # 같은 취급품목 표현에서 최대 몇 곳까지 뽑을지. v1(가맹점 단위 추출)은 '한식' 등 흔한 품목이 몰려 고유 쿼리가 27%였다(2026-10-19).
  max_per_item: 2
  # 프롬프트 예시(few-shot). 지금은 기존 벤치마크 train 쿼리, 서비스셋 dev가 생기면 그것으로 바꾼다.
  fewshot_split: train
  # 정보가 상호명뿐인 가맹점은 LLM이 업종을 추측하게 되므로 A·C 생성에서 뺀다(B가 다룬다).
  skip_name_only: true
  upload_dir: colab_upload/generation
