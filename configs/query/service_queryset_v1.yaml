# 서비스형 쿼리셋 v1 작성 템플릿 설정 — scripts/make_service_queryset_template.py가 읽는다.
# 계획·작성 원칙은 docs/SERVICE_QUERYSET.md. 기존 업종 의도 쿼리셋(query_families_v1.yaml)과 섞지 않는 별도 셋이다.
version: service_queryset_v1
# 가맹점·시장 표본 추출용. 템플릿을 배포한 뒤에는 바꾸지 않는다(바꾸면 표본ID가 다른 가맹점을 가리킴).
random_seed: 20261019
output_path: data/query/service_queryset_v1.xlsx

# 묶음별 목표 개수(1차 500개, 2026-10-19 결정). 근거는 docs/SERVICE_QUERYSET.md 1절.
# B·C는 묶음별 결론을 낼 수 있게 test 100개 이상이 되도록 150·130으로 잡았다.
targets:
  A: {name: 업종 확장, count: 150}
  B: {name: 상호명·브랜드, count: 150}
  C: {name: 상품·상황, count: 130}
  D: {name: 지역+업종, count: 50}
  E: {name: 결과 없음, count: 20}

# 사람이 쓴 쿼리는 평가에만 쓴다(train에 넣지 않는다).
# 묶음마다 dev 25% / test 75%. A의 새 업종은 업종 단위, B~E는 쿼리 단위로 나눈다.
split:
  dev_share: 0.25

# A: 코퍼스 취급품목 중 기존 업종어로 안 잡히는 표현을 세어 후보로 보여 준다.
item_gap:
  top_n: 120
  # 업종을 알려 주지 않는 일반어 — 후보에서 뺀다(이런 가맹점은 B 묶음 상호명 쿼리로 다룬다).
  generic_items: [음식, 음식점, 일반음식, 일반음식점, 음식점업, 휴게음식, 휴게음식점, 간이음식, 기타, 서비스, 서비스업,
                  식품, 식료품, 가공식품, 외의, 소매, 소매업, 도매, 도소매, 판매, 기타소매, 일반, 제조, 기타서비스, 및, 등, 기타음식,
                  음식업, 일반음식점업, 용품, 전자상거래, 이용업, 농축수산품, 업]
  # 기존 업종의 질의가 이 개수 이하(오타 비활성 제외)면 '보강 필요'로 표시
  thin_family_max_queries: 2

# B: 가맹점 표본. 층은 시장유형 비율대로 뽑고, 취급품목이 비었거나 일반어뿐인 가맹점을 일부러 더 넣는다
# (상호명으로만 찾을 수 있는 가맹점 — 기존 쿼리셋이 못 재는 부분).
store_sample:
  n: 240
  name_only_share: 0.25
chain:
  min_count: 30
  # 브랜드가 아니라 흔한 단어인 첫 토큰 — 후보에서 뺀다
  generic_name_tokens: [카페, 더, ., 수, 스타일, 행복한, 맛있는, 우리동네, 농업회사법인, 필라테스, 네일, 스튜디오, 소문난,
                        사계절, 오늘도, 센스, 토마토, 오렌지, 코코, 다온, 다모아, 올리브, 트라이, 멋쟁이, 이모네, 신데렐라, 우리]
  # 같은 브랜드의 여러 표기. 키가 대표명. 이 묶음 자체가 "BBQ"로 "비비큐"를 찾는지 볼 판정 근거가 된다.
  aliases:
    GS25: [GS25, 지에스25, 지에스(GS)25]
    CU: [CU, 씨유]
    파리바게뜨: [파리바게뜨, 파리바게트]
    배스킨라빈스: [배스킨라빈스, 베스킨라빈스]
    이디야: [이디야, 이디야커피]
    텐퍼센트커피: [텐퍼센트, 텐퍼센트커피]
    본죽&비빔밥: [본죽&비빔밥, 본죽앤비빔밥]
    BBQ: [비비큐, BBQ]
    BHC: [비에이치씨, BHC]
    메가커피: [메가엠지씨커피, 메가커피]
  # '○○상회'처럼 흔한 상호 꼬리말 — 체인이 아니라 '동명 가맹점'으로 표시(이름이 같아도 다른 가게)
  common_name_suffixes: [상회, 수산, 떡집, 식당, 야채, 상사, 농산, 마트, 정육점]

# D: 시장 표본. 시도별 비율대로 뽑되 시도마다 최소 개수를 둔다. 가정위치ID로도 쓴다.
market_sample:
  n: 150
  min_per_region: 3
  min_stores: 20

# E: 결과가 없어야(또는 거의 없어야) 하는 쿼리 후보. 코퍼스 상호명·취급품목에 몇 번 나오는지 템플릿에 함께 적는다.
# 0~수 건인 것만 쓴다. 많이 나오는 것(예: 동물병원, 필라테스)은 E가 아니라 A 후보다.
absent_candidates: [영화관, 주민센터, 우체국, 공항, 맥도날드, 코스트코, 이케아, 렌터카, 법무사, 예식장, 장례식장, 버스터미널,
                    롯데마트, 홈플러스, 스타벅스, 찜질방, 부동산, 주차장, 도서관, 은행, 대학병원, 경찰서, 구청, 기차표, 호텔,
                    워터파크, 놀이공원, 백화점, 면세점, 아울렛]

# C: 상황 카드. 업종·품목 이름을 쓰지 않는다(쓰면 작성자가 그 단어를 그대로 베낀다 — 기존 셋이 T1·T2에 쏠린 원인).
scenario_cards:
  - 추석 차례상을 준비해야 한다
  - 내일 아이 생일 파티가 있다
  - 이번 주말에 처음으로 캠핑을 간다
  - 혼자 자취를 막 시작했다
  - 부모님 댁에 들고 갈 선물이 필요하다
  - 비 오는 날 저녁, 뜨끈한 국물이 당긴다
  - 오늘이 복날이다
  - 친구 집들이에 초대받았다
  - 다음 주에 김장을 한다
  - 감기 기운이 있고 목이 아프다
  - 강아지 산책 용품이 다 떨어졌다
  - 새로 산 정장 바지가 너무 길다
  - 구두 뒤축이 다 닳았다
  - 다음 달 결혼식에 하객으로 간다
  - 아이가 다음 주에 새 학기를 시작한다
  - 이력서에 붙일 사진이 필요하다
  - 휴대폰 화면이 깨졌다
  - 아이 자전거 바퀴에 바람이 빠졌다
  - 부모님이 요즘 말을 잘 못 알아들으신다
  - 등산을 처음 시작하려 한다
  - 팀 회식 장소를 정해야 한다(10명)
  - 야근 끝나고 밤 11시, 출출하다
  - 출근길에 간단히 아침을 먹고 싶다
  - 다이어트 중인데 밖에서 한 끼 먹어야 한다
  - 갑자기 손님이 와서 술안주가 필요하다
  - 이사 와서 커튼과 등을 바꾸고 싶다
  - 거실에 화분을 하나 들이고 싶다
  - 주방 수도꼭지에서 물이 샌다
  - 어깨가 뭉치고 몸이 찌뿌둥하다
  - 아기 이유식을 시작한다
  - 어버이날이 다가온다
  - 시장 구경 왔는데 걸으면서 먹을 게 필요하다
  - 주말농장을 시작한다
  - 친구가 낚시에 데려가 준다고 했다
  - 지갑에 온누리상품권이 남아 있다
  - 외국인 친구에게 한국적인 선물을 하고 싶다
  - 반찬 만들기가 너무 귀찮다
  - 머리가 너무 길어졌다
  - 요즘 글씨가 흐릿하게 보인다
  - 겨울 이불을 꺼냈는데 냄새가 난다
  - 아이가 피아노를 배우고 싶어 한다
  - 제사에 올릴 생선이 필요하다
  - 산후조리 중인 가족에게 보양식을 해 주고 싶다
  - 노트북이 갑자기 안 켜진다
  - 다음 주가 결혼기념일이다

# C 추가 카드(2026-10-21) — C는 앵커 사례를 붙여도 1km 기준 정답 있는 test가 100개에 못 미쳐(최대 93) 더 받는다.
# 카드ID는 C046부터. 기존 카드와 겹치지 않는 상황, 업종·품목 이름은 쓰지 않음.
scenario_cards_extra:
  - 갑자기 정전이 돼서 비상용으로 쓸 불빛이 필요하다
  - 운동화 밑창이 떨어졌다
  - 아이 학교에서 체육 시간에 입을 옷을 사 오라고 했다
  - 집에 밥 지을 쌀이 다 떨어졌다
  - 손님이 오는데 내놓을 과일을 예쁘게 담아 가고 싶다
  - 제사상에 올릴 술이 필요하다
  - 강아지 털이 너무 길어 정리해 줘야 한다
  - 자동차 와이퍼가 고장 났다
  - 갑자기 추워졌는데 두꺼운 겉옷이 없다
  - 찬물을 마시면 이가 시리다
  - 집들이를 했더니 손님용 그릇이 모자란다
  - 비가 오는데 쓸 것이 없다
  - 아버지 환갑 잔치를 준비한다
  - 아기가 태어난 지 백 일이 됐다
  - 밤에 아이가 갑자기 열이 난다
  - 주말에 가족끼리 마당에서 고기를 구워 먹기로 했다
  - 이사 왔는데 현관문 잠금장치를 바꾸고 싶다
  - 친구가 가게를 새로 열어서 축하 선물을 해야 한다
  - 아이가 아파서 부드럽고 소화 잘 되는 것을 먹여야 한다
  - 내일 소풍인데 먹을 것을 챙겨 가야 한다

# 작성자별 배정 파일 — scripts/make_writer_sheets.py, 절차는 docs/QUERY_WRITING_GUIDE.md 1부.
writers:
  # 2026-10-20: 6명 → 2명 → 3명. 1인 약 120줄(C 45 + E 7 + A 50 + D 17), 1부·2부 두 번에 나눠 쓴다.
  ids: [W1, W2, W3]
  output_dir: data/query/writers
  # 한 파일 배치(--layout single)의 파일 이름. 이전 배정 파일(6명·2명)과 섞이지 않게 인원수를 붙인다.
  single_file: 서비스셋_직접작성_v1_3명.xlsx
  # C: 카드 한 장을 서로 다른 작성자 몇 명에게 줄지. 3명이면 셋 다 45장 전부(45 × 3 = 135줄 ≥ 목표 130).
  card_overlap: 3
  # A: 업종 30개(작성자 수로 나눔 — 3명이면 1인 10개 × 5개). A_업종후보에서 고른 것 — 미채택 15 + 기존 보강 5 + 미포함 품목 10.
  # 미포함 품목 중 기존 업종과 같은 뜻인 것(식육·육류·삼겹살→정육, 양약→의약품, 헤어→미용, 서적→서점 등)은 넣지 않았다.
  a_industries: [식료품, 태권도, 감자탕, 골프, 당구, 노래연습장, 컴퓨터, 마라탕, 조명, 닭갈비, 숙박, 심리상담, 악기, 보청기, 자전거,
                 낚시, 농자재, 사진, 인쇄, 유아용품,
                 곱창, 장어, 닭발, 샐러드, 커텐, 고추, 시계, 디저트, 약초, 핫도그]
  a_queries_per_industry: 5
  d_markets_per_writer: 17
  e_queries_per_writer: 7

# 작성 결과 → 쿼리셋 — scripts/import_service_queries.py, 설명은 docs/SERVICE_QUERYSET.md 4절.
import:
  # 작성자 완료본(여러 개 가능, 없는 파일은 건너뜀). 추가 C 카드 완료본은 회수하면 같은 폴더에 둔다.
  writers_completed:
    - data/query/writers_completed/서비스셋_직접작성_v1_3명_completed.xlsx
    - data/query/writers_completed/서비스셋_직접작성_v1_추가C_completed.xlsx
  # 사람이 직접 쓴 B 150개(개별 가맹점 105 + 브랜드 45)가 든 팀 작성본. 나머지(A·C·D·E)는 AI 초안이라 쓰지 않는다.
  team_completed: data/query/service_queryset_v1_team_completed.xlsx
  team_human_methods: ["개별 가맹점 표본 기반(독립 표본)", "상호/브랜드 검색(독립 표본)"]
  output: data/query/service_queries_v1.csv
  # 같은 문자열이 여러 묶음에 나오면 앞의 묶음에 둔다(C는 재료 없이 먼저 쓴 반응이라 A보다 앞).
  bundle_priority: [B, D, C, A, E]
  # 판정·검토 뒤 빼야 할 쿼리. {query: ..., reason: ...} — 지우지 않고 status=excluded로 남긴다.
  exclude_queries: []
  # 진행자가 직접 더한 쿼리(작성자 파일 밖). writer는 facilitator로 기록된다.
  # E: 이름이 겹치는 가맹점(신세계약국·샤넬의상실, 숙박업소)은 있어도 그 의도를 채우는 가맹점은 없는 함정형(2026-10-20).
  extra_queries:
    - {query: 신세계, bundle: E, intent: 범위 밖(백화점 브랜드)}
    - {query: 샤넬, bundle: E, intent: 범위 밖(명품 브랜드)}
    - {query: 5성급 호텔, bundle: E, intent: 범위 밖(고급 호텔)}

# 판정·pool — docs/SERVICE_ANNOTATION_GUIDELINE.md, scripts/build_service_pool.py
judging:
  benchmark_dir: benchmark/service_ko_v1
  # 판정은 2km 안 가맹점으로 하고, 1km(현재 서비스)·2km 두 반경으로 채점한다. 1km ⊂ 2km라 판정 한 번으로 둘 다 잰다.
  judge_radius_km: 2
  report_radii_km: [1, 2]
  # 시스템마다 반경 안 상위 몇 개를 pool에 넣을지. --dry-run 표로 판정 건수를 보고 정한다.
  depth: 10
  run_depth: 50            # run 파일에는 반경 안 상위 50개까지 남긴다(채점용)
  keyword_per_query: 10    # 쿼리 단어가 상호·취급품목에 들어간 가맹점 후보(점수 높은 순)
  dense_models:
    - configs/models/bge_m3_ft_mj_20261014_0743.yaml
    - configs/models/bge_m3.yaml
  double_annotation_share: 0.2
  # 판정자 → 그 사람이 쓴 쿼리의 작성자 ID(작성자가 아니면 null). 이중 판정 20%는 둘 다, 나머지는 판정 쌍이 비슷하게 한 명에게.
  # 자기가 쓴 쿼리는 가능하면 다른 사람에게 준다(2026-10-20 판정자 2명).
  annotators: {A: null, B: null}
  # 데이터에 없는 속성(영업시간·예약·평판)이 들어간 쿼리 표시 — 판정은 업종만, 결과는 따로 집계
  attribute_keywords: [단체 예약, 단체 회식, 예약, 늦게, 늦은, 24시, 심야, 맛집, 분위기, 넓은, 시설 좋은, 잘하는, 잘 찍는, 맛있는, 배달, 드라이브 스루, 가능한]
  # anchor 사례(scripts/build_service_instances.py)의 앵커 단어 지정. 자동 선택(가장 드문 업종어)이 엉뚱한 업종을 고른 쿼리만
  # 쿼리 뜻으로 정했다(시스템 결과는 보지 않음, 2026-10-21). 앵커 가게도 사람이 판정하므로 잘못 고르면 정답이 안 생길 뿐 점수는 틀어지지 않는다.
  anchor_keywords:
    휴대폰 수리: 휴대폰
